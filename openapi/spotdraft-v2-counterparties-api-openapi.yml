openapi: 3.2.0
info:
  title: SpotDraft V2 Counterparties API
  version: v1
  x-version: v1
  x-logo:
    url: https://cdn.spotdraft.com/assets/logo-black-new.png
    backgroundColor: transparent
    altText: SpotDraft Logo
    href: https://spotdraft.com
  x-favicon: https://cdn.spotdraft.com/assets/favicon.png
  x-footer: © SpotDraft Inc. All rights reserved.
  description: '# SpotDraft Public API


    Welcome to the **SpotDraft Public API**.'
servers:
- url: https://api.eu.spotdraft.com
  description: Europe
- url: https://api.in.spotdraft.com
  description: India
- url: https://api.us.spotdraft.com
  description: United States
- url: https://api.me.spotdraft.com
  description: Middle East
tags:
- name: V2 Counterparties
  description: Create, search, and manage counterparties across public API versions.
paths:
  /api/v2/public/counter_parties/:
    get:
      operationId: v2_public_counter_parties_list
      description: Get the list of counterparties
      summary: List Counterparties
      parameters:
      - in: query
        name: filter__client_email_address
        schema:
          type: string
        description: Filters on the counter party email. Does an exact match.
      - in: query
        name: filter_custom__<custom_field_name>
        schema:
          type: string
        description: 'Filters all the counterparties which have the custom field values present. Example: filter_custom__vendor_id=1234'
      - in: query
        name: limit
        schema:
          type: integer
          default: 10
        description: The number of items to return per page.
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: The page to return. Page numbers start at 1.
      tags:
      - V2 Counterparties
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterpartyListAPIResponse'
              examples:
                Example1:
                  value:
                    page: 1
                    limit: 10
                    total_results: 50
                    results:
                    - id: 102
                      name: Mike Reed
                      is_individual: false
                      contacts:
                      - id: 100
                        name: Susan Ervin
                        email: SueErvin@yahoo.com
                      primary_address:
                        city_name: Cincinnati
                        state_name: Ohio
                        country_name: USA
                        zipcode: '513'
                        line_one: 'st: 3, block: 2, Jenkins Road'
                      status: ACTIVE
                      custom_fields:
                        vendor_id: '1234'
                        gst_number: 22AAAAA0000A1Z5
                  summary: Example 1
          description: Counterparty
      x-tagGroup: Platform
    post:
      operationId: v2_public_counter_parties_create
      description: 'This method takes in counter party details to be used for counter Party creation

        and returns status code 201 along with the counterparty workspace id if successfully created.'
      summary: Create Counterparty
      tags:
      - V2 Counterparties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCounterPartyAPIRequest'
            examples:
              Example1:
                value:
                  is_individual: false
                  organization_type: Private Limited
                  organization_name: Acme Corporation
                  contact_name: Mike Reed
                  contact_email: Mike_reed@yahoo.com
                  brand_name: Acme Corporation
                  primary_address:
                    city_name: Cincinnati
                    state_name: Ohio
                    country_name: USA
                    zipcode: '513'
                    line_one: 'st: 3, block: 2, Jenkins Road'
                  custom_fields:
                    vendor_id: '1234'
                    gst_number: 22AAAAA0000A1Z5
                summary: Example 1
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCounterPartyAPIRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCounterPartyAPIRequest'
        required: true
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterPartyAPIResponse'
              examples:
                Example1:
                  value:
                    id: 102
                    name: Mike Reed
                    is_individual: false
                    contacts:
                    - id: 100
                      name: Susan Ervin
                      email: SueErvin@yahoo.com
                    primary_address:
                      city_name: Cincinnati
                      state_name: Ohio
                      country_name: USA
                      zipcode: '513'
                      line_one: 'st: 3, block: 2, Jenkins Road'
                    status: ACTIVE
                    custom_fields:
                      vendor_id: '1234'
                      gst_number: 22AAAAA0000A1Z5
                  summary: Example 1
          description: Counterparty
      x-tagGroup: Platform
  /api/v2/public/counter_parties/{counterparty_id}:
    get:
      operationId: v2_public_counter_parties_retrieve_by_id
      description: Get the details of a counterparty by its ID
      summary: Get Counterparty
      parameters:
      - in: path
        name: counterparty_id
        schema:
          type: integer
        description: ID of the Counterparty.
        required: true
      tags:
      - V2 Counterparties
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterPartyAPIResponse'
              examples:
                Example1:
                  value:
                    id: 102
                    name: Mike Reed
                    is_individual: false
                    contacts:
                    - id: 100
                      name: Susan Ervin
                      email: SueErvin@yahoo.com
                    primary_address:
                      city_name: Cincinnati
                      state_name: Ohio
                      country_name: USA
                      zipcode: '513'
                      line_one: 'st: 3, block: 2, Jenkins Road'
                    status: ACTIVE
                    custom_fields:
                      vendor_id: '1234'
                      gst_number: 22AAAAA0000A1Z5
                  summary: Example 1
          description: Counterparty
      x-tagGroup: Platform
    patch:
      operationId: v2_public_counter_parties_partial_update
      description: Update counterparty details
      summary: Update Counterparty
      parameters:
      - in: path
        name: counterparty_id
        schema:
          type: integer
        description: ID of the Counterparty.
        required: true
      tags:
      - V2 Counterparties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExternalCounterpartyUpdateRequest'
            examples:
              Example1:
                value:
                  name: Susan Ervin
                  brand_name: Susan's Org
                  custom_fields:
                    vendor_id: '1234'
                    gst_number: 22AAAAA0000A1Z5
                summary: Example 1
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedExternalCounterpartyUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedExternalCounterpartyUpdateRequest'
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterPartyAPIResponse'
              examples:
                Example1:
                  value:
                    id: 102
                    name: Mike Reed
                    is_individual: false
                    contacts:
                    - id: 100
                      name: Susan Ervin
                      email: SueErvin@yahoo.com
                    primary_address:
                      city_name: Cincinnati
                      state_name: Ohio
                      country_name: USA
                      zipcode: '513'
                      line_one: 'st: 3, block: 2, Jenkins Road'
                    status: ACTIVE
                    custom_fields:
                      vendor_id: '1234'
                      gst_number: 22AAAAA0000A1Z5
                  summary: Example 1
          description: Update Counterparty
      x-tagGroup: Platform
  /api/v2/public/counter_parties/{counterparty_id}/addresses/:
    get:
      operationId: v2_public_counter_parties_addresses_retrieve
      description: Get the list of counterparty addresses
      summary: List Counterparty Addresses
      parameters:
      - in: path
        name: counterparty_id
        schema:
          type: integer
        description: ID of the Counterparty.
        required: true
      - in: query
        name: limit
        schema:
          type: integer
          default: 10
        description: The number of items to return per page.
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: The page to return. Page numbers start at 1.
      tags:
      - V2 Counterparties
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterpartyListAddressResponse'
              examples:
                Example1:
                  value:
                    page: 1
                    limit: 10
                    total_results: 50
                    results:
                    - id: 100
                      line_one: 'st: 3, block: 2, Jenkins Road'
                      city_name: Cincinnati
                      state_name: Ohio
                      zipcode: '513'
                      country_name: USA
                      email: john.doe@gmail.com
                      phone: (415) 555-0198
                  summary: Example 1
          description: List Counterparty Addresses
      x-tagGroup: Platform
    post:
      operationId: v2_public_counter_parties_addresses_create
      description: Create counterparty address
      summary: Create Counterparty Address
      parameters:
      - in: path
        name: counterparty_id
        schema:
          type: integer
        description: ID of the Counterparty.
        required: true
      tags:
      - V2 Counterparties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCounterPartyAddressRequest'
            examples:
              Example1:
                value:
                  line_one: 'st: 3, block: 2, Jenkins Road'
                  city_name: Cincinnati
                  state_name: Ohio
                  zipcode: '513'
                  country_name: USA
                  email: test@yopmail.com
                  phone: '1234567890'
                  country_iso_code: US
                summary: Example 1
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateCounterPartyAddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateCounterPartyAddressRequest'
        required: true
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterPartyAddressResponse'
              examples:
                Example1:
                  value:
                    id: 100
                    line_one: 'st: 3, block: 2, Jenkins Road'
                    city_name: Cincinnati
                    state_name: Ohio
                    zipcode: '513'
                    country_name: USA
                    email: john.doe@gmail.com
                    phone: (415) 555-0198
                  summary: Example 1
          description: Create Counterparty Address
      x-tagGroup: Platform
  /api/v2/public/counter_parties/{counterparty_id}/addresses/{address_id}/:
    patch:
      operationId: v2_public_counter_parties_addresses_partial_update
      description: Update counterparty address
      summary: Update Counterparty Address
      parameters:
      - in: path
        name: address_id
        schema:
          type: integer
        description: ID of the Counterparty address.
        required: true
      - in: path
        name: counterparty_id
        schema:
          type: integer
        description: ID of the Counterparty.
        required: true
      tags:
      - V2 Counterparties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExternalCounterpartyAddressUpdateRequest'
            examples:
              Example1:
                value:
                  city_name: Cincinnati
                  state_name: Ohio
                  country_iso_code: IN
                  zipcode: '513'
                  line_one: 'st: 3, block: 2, Jenkins Road'
                  is_primary: false
                summary: Example 1
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedExternalCounterpartyAddressUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedExternalCounterpartyAddressUpdateRequest'
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterPartyAddressResponse'
              examples:
                Example1:
                  value:
                    id: 100
                    line_one: 'st: 3, block: 2, Jenkins Road'
                    city_name: Cincinnati
                    state_name: Ohio
                    zipcode: '513'
                    country_name: USA
                    email: john.doe@gmail.com
                    phone: (415) 555-0198
                  summary: Example 1
          description: Update Counterparty Address
      x-tagGroup: Platform
  /api/v2/public/counter_parties/{counterparty_id}/contacts:
    get:
      operationId: v2_public_counter_parties_contacts_retrieve
      description: Get the list of counterparty contacts
      summary: List Counterparty Contacts
      parameters:
      - in: path
        name: counterparty_id
        schema:
          type: integer
        description: ID of the Counterparty.
        required: true
      - in: query
        name: limit
        schema:
          type: integer
          default: 10
        description: The number of items to return per page.
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: The page to return. Page numbers start at 1.
      tags:
      - V2 Counterparties
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterPartyContactsListAPIResponse'
              examples:
                Example1:
                  value:
                    page: 1
                    limit: 10
                    total_results: 1
                    results:
                    - id: 100
                      name: Susan Ervin
                      email: dummy@email.com
                      is_primary: false
                  summary: Example 1
          description: List Counterparty Contacts
      x-tagGroup: Platform
    post:
      operationId: v2_public_counter_parties_contacts_create
      summary: Create Counterparty Contact
      parameters:
      - in: path
        name: counterparty_id
        schema:
          type: integer
        description: ID of the Counterparty.
        required: true
      tags:
      - V2 Counterparties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalCounterpartyContactCreateRequest'
            examples:
              Example1:
                value:
                  name: Susan Ervin
                  email: dummy@email.com
                  is_primary: false
                summary: Example 1
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExternalCounterpartyContactCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExternalCounterpartyContactCreateRequest'
        required: true
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterPartyContactResponse'
              examples:
                Example1:
                  value:
                    id: 100
                    name: Susan Ervin
                    email: dummy@email.com
                    is_primary: false
                  summary: Example 1
          description: Create Counterparty Contact
      x-tagGroup: Platform
  /api/v2/public/counter_parties/{counterparty_id}/contacts/bulk/:
    patch:
      operationId: v2_public_counter_parties_contacts_bulk_partial_update
      description: Bulk Update counterparty contacts
      summary: Bulk Update Counterparty Contacts
      parameters:
      - in: path
        name: counterparty_id
        schema:
          type: integer
        description: ID of the Counterparty.
        required: true
      tags:
      - V2 Counterparties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExternalCounterpartyContactBulkUpdateListRequest'
            examples:
              Example1:
                value:
                  contacts:
                  - id: 100
                    name: Susan Ervin
                    email: dummy@email.com
                    is_primary: false
                summary: Example 1
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedExternalCounterpartyContactBulkUpdateListRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedExternalCounterpartyContactBulkUpdateListRequest'
        required: true
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalCounterpartyContactBulkUpdateResponse'
          description: Bulk Update Counterparty Contacts
      x-tagGroup: Platform
  /api/v2/public/counter_parties/{counterparty_id}/contacts/{contact_id}/:
    patch:
      operationId: v2_public_counter_parties_contacts_partial_update
      description: Update counterparty contact
      summary: Update Counterparty Contact
      parameters:
      - in: path
        name: contact_id
        schema:
          type: integer
        description: ID of the Counterparty contact.
        required: true
      - in: path
        name: counterparty_id
        schema:
          type: integer
        description: ID of the Counterparty.
        required: true
      tags:
      - V2 Counterparties
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExternalCounterpartyContactUpdateRequest'
            examples:
              Example1:
                value:
                  name: Susan Ervin
                  email: dummy@email.com
                  is_primary: false
                summary: Example 1
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedExternalCounterpartyContactUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedExternalCounterpartyContactUpdateRequest'
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterPartyContactResponse'
              examples:
                Example1:
                  value:
                    id: 100
                    name: Susan Ervin
                    email: dummy@email.com
                    is_primary: false
                  summary: Example 1
          description: Update Counterparty Contact
      x-tagGroup: Platform
    delete:
      operationId: v2_public_counter_parties_contacts_destroy
      description: Delete counterparty contact
      summary: Delete Counterparty Contact
      parameters:
      - in: path
        name: contact_id
        schema:
          type: integer
        description: ID of the Counterparty contact.
        required: true
      - in: path
        name: counterparty_id
        schema:
          type: integer
        description: ID of the Counterparty.
        required: true
      tags:
      - V2 Counterparties
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '204':
          description: Delete Counterparty Contact
      x-tagGroup: Platform
components:
  schemas:
    PatchedExternalCounterpartyUpdateRequest:
      title: ExternalCounterpartyUpdateRequest
      type: object
      properties:
        name:
          title: Name
          description: The updated name of the Counterparty
          minLength: 1
          type: string
        brand_name:
          title: Brand Name
          description: The updated brand name of the Counterparty
          type: string
        custom_fields:
          title: Custom Fields
          description: The updated custom fields of the Counterparty
          type: object
      examples:
      - name: Susan Ervin
        brand_name: Susan's Org
        custom_fields:
          vendor_id: '1234'
          gst_number: 22AAAAA0000A1Z5
    CounterPartyAddressResponse:
      title: CounterPartyAddressResponse
      type: object
      properties:
        id:
          title: Id
          description: The ID of this address. Globally Unique.
          type: integer
        line_one:
          title: Line One
          description: The first line of the address. Usually the apartment, floor, and street information.
          type: string
        city_name:
          title: City Name
          description: The city name for this address.
          type: string
        state_name:
          title: State Name
          description: The state name for this address.
          type: string
        zipcode:
          title: Zipcode
          description: The zip/pin/postal code for this address.
          type: string
        country_name:
          title: Country Name
          description: The name of the country associated with this counterparty address.
          type: string
        email:
          title: Email
          description: The email address associated with this counterparty address (if any).
          type: string
        phone:
          title: Phone
          description: The phone number associated with this counterparty address (if any).
          type: string
      required:
      - id
      - line_one
      - city_name
      - state_name
      - zipcode
      - country_name
      examples:
      - id: 100
        line_one: 'st: 3, block: 2, Jenkins Road'
        city_name: Cincinnati
        state_name: Ohio
        zipcode: '513'
        country_name: USA
        email: john.doe@gmail.com
        phone: (415) 555-0198
    ExternalCounterpartyContactCreateRequest:
      title: ExternalCounterpartyContactCreateRequest
      type: object
      properties:
        name:
          title: Name
          description: Name of the contact
          minLength: 1
          type: string
        email:
          title: Email
          description: Email of the contact
          type: string
          format: email
        is_primary:
          title: Is Primary
          description: Whether the contact needs to be set as the primary contact.
          type: boolean
      required:
      - name
      - email
      - is_primary
      examples:
      - name: Susan Ervin
        email: dummy@email.com
        is_primary: false
    CreateCounterPartyAPIRequest:
      title: CreateCounterPartyAPIRequest
      type: object
      properties:
        is_individual:
          title: Is Individual
          description: Defines if this Counterparty is an individual or an organization like a company. When `true`, `contact_name` and `contact_email` are required. When `false`, `organization_name` is required.
          type: boolean
        organization_type:
          title: Organization Type
          description: The type of the counterparty if it is an organization. Expects values like LLC, LLP, etc. Please ask help@spotdraft.com for valid values.
          type: string
        organization_name:
          title: Organization Name
          description: The name of the counterparty if it is an organization. Expects the name of the company/entity that is the counterparty. Required when `is_individual=false`.
          type: string
        contact_name:
          title: Contact Name
          description: The name of the counterparty in case of an individual, and the name of the Point of Contact in case of organizations. Required together with `contact_email` when `is_individual=true`.
          type: string
        contact_email:
          title: Contact Email
          description: The email of the counterparty in case of an individual, and the email of the Point of Contact in case of organizations. Required together with `contact_name` when `is_individual=true`.
          type: string
        brand_name:
          title: Brand Name
          description: The brand name of the counterparty. This is typically used for display purposes and contract templates.
          type: string
        primary_address:
          title: Primary Address
          type: object
          properties:
            line_one:
              title: Line One
              description: The first line of the address. Usually the apartment, floor, and street information.
              type: string
            city_name:
              title: City Name
              description: The city name for this address.
              type: string
            state_name:
              title: State Name
              description: The state name for this address.
              default: ''
              type: string
            zipcode:
              title: Zipcode
              description: The zip/pin/postal code for this address.
              default: ''
              type: string
            email:
              title: Email
              description: The email address associated with this counterparty address (if any).
              type: string
            phone:
              title: Phone
              description: The phone number associated with this counterparty address (if any).
              type: string
            country_name:
              title: Country Name
              description: The name of the country associated with this counterparty address. Any value passed here is ignored if `country_iso_code` is passed. Valid values are defined internally. Please ask help@spotdraft.com for more information.
              type: string
            country_iso_code:
              title: Country Iso Code
              description: The ISO-3166-1 Alpha-2 code of the country associated with this counterparty address. Any value passed here is overrides `country`. Valid values can be found [here](https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes).
              type: string
          required:
          - line_one
          - city_name
          - country_name
          examples:
          - line_one: 'st: 3, block: 2, Jenkins Road'
            city_name: Cincinnati
            state_name: Ohio
            zipcode: '513'
            country_name: USA
            email: test@yopmail.com
            phone: '1234567890'
            country_iso_code: US
          description: The address details of the counterparty. Used to render the address in the contract templates.
        custom_fields:
          title: Custom Fields
          description: 'Custom field values for the counterparty. Note: The custom_fields feature is available only upon request. To enable this feature, please contact help@spotdraft.com'
          type: object
      required:
      - is_individual
      examples:
      - is_individual: false
        organization_type: Private Limited
        organization_name: Acme Corporation
        contact_name: Mike Reed
        contact_email: Mike_reed@yahoo.com
        brand_name: Acme Corporation
        primary_address:
          city_name: Cincinnati
          state_name: Ohio
          country_name: USA
          zipcode: '513'
          line_one: 'st: 3, block: 2, Jenkins Road'
        custom_fields:
          vendor_id: '1234'
          gst_number: 22AAAAA0000A1Z5
    PatchedExternalCounterpartyContactUpdateRequest:
      title: ExternalCounterpartyContactUpdateRequest
      type: object
      properties:
        name:
          title: Name
          description: The updated name of the Contact
          minLength: 1
          type: string
        email:
          title: Email
          description: The updated email of the Contact
          type: string
          format: email
        is_primary:
          title: Is Primary
          description: Whether the contact needs to be set as the primary contact.
          type: boolean
      examples:
      - name: Susan Ervin
        email: dummy@email.com
        is_primary: false
    CounterPartyContactsListAPIResponse:
      title: CounterPartyContactsListAPIResponse
      type: object
      properties:
        page:
          title: Page
          type: integer
        limit:
          title: Limit
          type: integer
        total_results:
          title: Total Results
          type: integer
        results:
          title: Results
