openapi: 3.2.0
info:
  title: SpotDraft V2.1 Users API
  version: v1
  x-version: v1
  x-logo:
    url: https://cdn.spotdraft.com/assets/logo-black-new.png
    backgroundColor: transparent
    altText: SpotDraft Logo
    href: https://spotdraft.com
  x-favicon: https://cdn.spotdraft.com/assets/favicon.png
  x-footer: © SpotDraft Inc. All rights reserved.
  description: '# SpotDraft Public API


    Welcome to the **SpotDraft Public API**.'
servers:
- url: https://api.eu.spotdraft.com
  description: Europe
- url: https://api.in.spotdraft.com
  description: India
- url: https://api.us.spotdraft.com
  description: United States
- url: https://api.me.spotdraft.com
  description: Middle East
tags:
- name: V2.1 Users
  description: List users, list roles, manage role membership, invite users, and update user access across public API versions.
paths:
  /api/v2.1/public/auth/roles/:
    get:
      operationId: v2.1_public_auth_roles_retrieve
      description: Returns the Roles that exist for the workspace whose credentials are used.
      summary: Get Active Roles
      tags:
      - V2.1 Users
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalUserActiveRolesResponseList'
              examples:
                Example1:
                  value:
                    active_roles:
                    - id: 1
                      name: Legal Team
                      description: The in-house legal team responsible for TPP Reviews.
                    - id: 2
                      name: NA Sales
                      description: The North America Sales Team
                    - id: 3
                      name: APAC Sales
                      description: The Asia Pacific Sales Team (ex Japan)
                  summary: Example 1
          description: Success
      x-tagGroup: Platform
  /api/v2.1/public/auth/roles/{role_id}/members:
    post:
      operationId: v2.1_public_auth_roles_members_create
      description: 'Adds one or more users to the specified role within the current workspace.

        Use this when role membership is managed separately from user invitation.'
      summary: Add Role Member
      parameters:
      - in: path
        name: role_id
        schema:
          type: integer
        description: Use the [Get Active Roles](#tag/v21-users/GET/api/v2.1/public/auth/roles/) API to get the role ID.
        required: true
      tags:
      - V2.1 Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicRoleMembersAddRequest'
            examples:
              Example1:
                value:
                  user_ids_to_add:
                  - 4567
                  - 2345
                summary: Example 1
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicRoleMembersAddRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicRoleMembersAddRequest'
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRoleMemberAddResponse'
              examples:
                Example1:
                  value:
                  - id: 6545
                    email: barack@obama.com
                    name: Barack Obama
                    designation: President
                  summary: Example 1
          description: Add Role Member
      x-tagGroup: Platform
    delete:
      operationId: v2.1_public_auth_roles_members_destroy
      description: 'Removes one or more users from the specified role within the current workspace.

        The role itself is not deleted.'
      summary: Delete Role Member
      parameters:
      - in: path
        name: role_id
        schema:
          type: integer
        description: Use the [Get Active Roles](#tag/v21-users/GET/api/v2.1/public/auth/roles/) API to get the role ID.
        required: true
      tags:
      - V2.1 Users
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '204':
          description: Delete Role Member
      x-tagGroup: Platform
  /api/v2.1/public/auth/users/:
    get:
      operationId: v2.1_public_auth_users_retrieve
      description: 'Lists organization users together with their assigned roles.

        Use `page`, `limit`, `user_email`, and `user_name` to page through results or narrow the list.'
      summary: Get User List
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          default: 10
        description: The number of items to return per page.
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: The page to return. Page numbers start at 1.
      - in: query
        name: user_email
        schema:
          type: string
        description: User email address for which that user list should be filtered. Please make sure that the value is url encoded. So for example, if the email address is `abc+123@xyz.com` the value passed should be `abc%2B123%40xyz.com`.
      - in: query
        name: user_name
        schema:
          type: string
        description: Filter users whose full name starts with the provided value. The comparison is case-insensitive and uses the format 'first name + last name'.
      tags:
      - V2.1 Users
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserWithRolesMinimalListResponse'
              examples:
                Example1:
                  value:
                    total_results: 2
                    page: 1
                    limit: 10
                    results:
                    - id: 100
                      first_name: Sonia
                      last_name: Sotomayor
                      email: sonia_sotomayor@notreally.supremecourt.gov
                      designation: Lawyer
                      is_active: true
                      roles:
                      - id: 456
                        name: Legal
                        description: Legal team
                    - id: 101
                      first_name: Elena
                      last_name: Kagan
                      email: elena_kagan@notreally.supremecourt.gov
                      designation: Lead Lawyer
                      is_active: true
                      roles:
                      - id: 123
                        name: Admin
                        description: Admin team
                      - id: 456
                        name: Legal
                        description: Legal team
                  summary: Example 1
          description: User List
      x-tagGroup: Platform
    post:
      operationId: v2.1_public_auth_users_create
      description: 'Invites a new user into the organization and assigns the requested roles in one call.

        Use this when onboarding workspace users from your own admin surface.'
      summary: Create and Invite User
      tags:
      - V2.1 Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteUserAndAssignRolesPublicRequest'
            examples:
              Example1:
                value:
                  first_name: Avery
                  last_name: Stone
                  designation: Legal Counsel
                  email: avery.stone@example.com
                  role_ids:
                  - 12
                  - 18
                summary: Example 1
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InviteUserAndAssignRolesPublicRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InviteUserAndAssignRolesPublicRequest'
        required: true
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUserInvitePublicApiResponse'
          description: User created and invited successfully
      x-tagGroup: Platform
  /api/v2.1/public/contracts/{contract_id}/authorized_users/:
    get:
      operationId: v2.1_public_contracts_authorized_users_retrieve
      description: Gets all the users with authorized access to a contract
      summary: Get Contract Authorized Users List
      parameters:
      - in: path
        name: contract_id
        schema:
          type: integer
        required: true
      tags:
      - V2.1 Users
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserMinimalListResponse'
              examples:
                Example1:
                  value:
                    total_results: 2
                    page: 1
                    limit: 10
                    results:
                    - id: 100
                      first_name: Sonia
                      last_name: Sotomayor
                      email: sonia_sotomayor@notreally.supremecourt.gov
                      designation: Lawyer
                    - id: 101
                      first_name: Elena
                      last_name: Kagan
                      email: elena_kagan@notreally.supremecourt.gov
                      designation: Lead Lawyer
                  summary: Example 1
          description: User List
      x-tagGroup: Platform
components:
  schemas:
    ExternalUserActiveRolesResponseList:
      title: ExternalUserActiveRolesResponseList
      description: External model containing list of active roles.
      type: object
      properties:
        active_roles:
          title: Active Roles
          description: The list of roles active in the current workspace.
          type: array
          items:
            title: ExternalUserActiveRolesData
            description: Details of an active role
            type: object
            properties:
              id:
                title: Id
                description: ID of the role. Use this to identify the role when calling APIs like Add/Delete Role Member.
                type: integer
              name:
                title: Name
                description: The user visible name of the role.
                type: string
              description:
                title: Description
                description: An option description that helps clarify the use of a particular role.
                type: string
            required:
            - id
            - name
      required:
      - active_roles
      examples:
      - active_roles:
        - id: 1
          name: Legal Team
          description: The in-house legal team responsible for TPP Reviews.
        - id: 2
          name: NA Sales
          description: The North America Sales Team
        - id: 3
          name: APAC Sales
          description: The Asia Pacific Sales Team (ex Japan)
    OrganizationUserInvitePublicApiResponse:
      title: OrganizationUserInvitePublicApiResponse
      type: object
      properties:
        email:
          title: Email
          type: string
        first_name:
          title: First Name
          type: string
        last_name:
          title: Last Name
          type: string
        designation:
          title: Designation
          type: string
        token:
          title: Token
          type: string
        disabled_token:
          title: Disabled Token
          type: boolean
        created_by_user:
          title: Created By User
          type: string
        role_ids:
          title: Role Ids
          type: array
          items:
            type: integer
      required:
      - email
      - token
      - disabled_token
      - created_by_user
    InviteUserAndAssignRolesPublicRequest:
      title: InviteUserAndAssignRolesPublicRequest
      type: object
      properties:
        first_name:
          title: First Name
          description: First name of the user being invited
          type: string
        last_name:
          title: Last Name
          description: Last name of the user being invited
          type: string
        designation:
          title: Designation
          description: Job title or role of the user in the organization
          type: string
        email:
          title: Email
          description: Email address of the user being invited
          type: string
        role_ids:
          title: Role Ids
          description: Optional list of role IDs to assign to the user at invite time. Use the V2.1 Get Active Roles API to fetch valid role ids.
          type: array
          items:
            type: integer
      required:
      - first_name
      - email
      examples:
      - first_name: Avery
        last_name: Stone
        designation: Legal Counsel
        email: avery.stone@example.com
        role_ids:
        - 12
        - 18
    PublicUserWithRolesMinimalListResponse:
      title: PublicUserWithRolesMinimalListResponse
      description: SD Generic Model from which all other Generic Models should inherit
      type: object
      properties:
        page:
          title: Page
          description: The current page number. Page numbers start at 1.
          type: integer
        limit:
          title: Limit
          description: The number of items returned per page.
          type: integer
        total_results:
          title: Total Results
          description: Total number of items in the result set.
          type: integer
        results:
          title: Results
          description: The actual results.
          type: array
          items:
            title: PublicMinimalUserWithRolesResponse
            type: object
            properties:
              id:
                title: Id
                description: ID of the user
                type: integer
              email:
                title: Email
                description: Email Id of the user
                type: string
              name:
                title: Name
                description: Name of the user
                type: string
              designation:
                title: Designation
                description: Designation of the user within the organization
                type: string
              roles:
                title: Roles
                description: Roles/Teams that this user belongs to
                type: array
                items:
                  title: ExternalUserActiveRolesData
                  description: Details of an active role
                  type: object
                  properties:
                    id:
                      title: Id
                      description: ID of the role. Use this to identify the role when calling APIs like Add/Delete Role Member.
                      type: integer
                    name:
                      title: Name
                      description: The user visible name of the role.
                      type: string
                    description:
                      title: Description
                      description: An option description that helps clarify the use of a particular role.
                      type: string
                  required:
                  - id
                  - name
              is_active:
                title: Is Active
                description: Shows whether the user is active or deactivated
                type: boolean
            required:
            - id
            - email
            - name
            - is_active
      required:
      - page
      - limit
      - total_results
      - results
      examples:
      - total_results: 2
        page: 1
        limit: 10
        results:
        - id: 100
          first_name: Sonia
          last_name: Sotomayor
          email: sonia_sotomayor@notreally.supremecourt.gov
          designation: Lawyer
          is_active: true
          roles:
          - id: 456
            name: Legal
            description: Legal team
        - id: 101
          first_name: Elena
          last_name: Kagan
          email: elena_kagan@notreally.supremecourt.gov
          designation: Lead Lawyer
          is_active: true
          roles:
          - id: 123
            name: Admin
            description: Admin team
          - id: 456
            name: Legal
            description: Legal team
    PublicRoleMemberAddResponse:
      title: PublicRoleMemberAddResponse
      description: A list of the members who were added to the role.
      type: array
      items:
        title: PublicMinimalUserResponse
        type: object
        properties:
          id:
            title: Id
            description: ID of the user
            type: integer
          email:
            title: Email
            description: Email Id of the user
            type: string
          name:
            title: Name
            description: Name of the user
            type: string
          designation:
            title: Designation
            description: Designation of the user within the organization
            type: string
        required:
        - id
        - email
        - name
      examples:
      - - id: 6545
          email: barack@obama.com
          name: Barack Obama
          designation: President
    PublicUserMinimalListResponse:
      title: PublicUserMinimalListResponse
      description: SD Generic Model from which all other Generic Models should inherit
      type: object
      properties:
        page:
          title: Page
          description: The current page number. Page numbers start at 1.
          type: integer
        limit:
          title: Limit
          description: The number of items returned per page.
          type: integer
        total_results:
          title: Total Results
          description: Total number of items in the result set.
          type: integer
        results:
          title: Results
          description: The actual results.
          type: array
          items:
            title: PublicMinimalUserResponse
            type: object
            properties:
              id:
                title: Id
                description: ID of the user
                type: integer
              email:
                title: Email
                description: Email Id of the user
                type: string
              name:
                title: Name
                description: Name of the user
                type: string
              designation:
                title: Designation
                description: Designation of the user within the organization
                type: string
            required:
            - id
            - email
            - name
      required:
      - page
      - limit
      - total_results
      - results
      examples:
      - total_results: 2
        page: 1
        limit: 10
        results:
        - id: 100
          first_name: Sonia
          last_name: Sotomayor
          email: sonia_sotomayor@notreally.supremecourt.gov
          designation: Lawyer
        - id: 101
          first_name: Elena
          last_name: Kagan
          email: elena_kagan@notreally.supremecourt.gov
          designation: Lead Lawyer
    PublicRoleMembersAddRequest:
      title: PublicRoleMembersAddRequest
      type: object
      properties:
        user_ids_to_add:
          title: User Ids To Add
          description: The user ids that are to be added to the role. The IDs are returned by the [Get User List](#tag/v21-users/GET/api/v2.1/public/auth/users/) API. This list must contain at least one user id.
          default: []
          type: array
          items:
            type: integer
      examples:
      - user_ids_to_add:
        - 4567
        - 2345
  securitySchemes:
    ClickwrapId:
      type: apiKey
      in: header
      name: clickwrap-id
      description: Public clickwrap identifier header.
    ClientId:
      type: apiKey
      name: client-id
      in: header
    ClientSecret:
      type: apiKey
      name: client-secret
      in: header
    NativeIntegrationBasic:
      type: http
      scheme: basic
      description: HTTP Basic auth for supported native integrations. Send base64(client_id:client_secret) in the Authorization header.
    OAuthBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth 2.0 bearer token for workspace user access.
    Origin:
      type: apiKey
      in: header
      name: Origin
      description: Browser origin header used for clickwrap domain validation.
