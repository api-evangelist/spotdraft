tags:
- name: V2.1 Clickwrap
  description: Clickwrap agreement preview, consent status, and contract creation endpoints.
paths:
  /api/v2.1/public/clickwrap/{clickwrap_id}/agreements/preview/:
    post:
      operationId: v2.1_public_clickwrap_agreements_preview_create
      description: 'Generates an HTML preview of a clickwrap agreement for the given clickwrap.


        Exposed on the **public** API so custom scripts can run under the clickwrap/CSP domain instead of the main app domain.'
      summary: Preview Clickwrap Agreement
      parameters:
      - in: path
        name: clickwrap_id
        schema:
          type: integer
        description: Numeric id of the clickwrap.
        required: true
      tags:
      - V2.1 Clickwrap
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClickwrapAgreementPreviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClickwrapAgreementPreviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClickwrapAgreementPreviewRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: Rendered HTML preview (`text/html`).
      x-tagGroup: Clickwrap
  /api/v2.1/public/clickwrap/{clickwrap_public_id}/:
    get:
      operationId: v2.1_public_clickwrap_retrieve
      description: Returns the clickwrap corresponding to the clickwrap public id
      summary: Get Clickwrap
      parameters:
      - in: path
        name: clickwrap_public_id
        schema:
          type: string
          format: uuid
        description: Public Id of Clickwrap
        required: true
      tags:
      - V2.1 Clickwrap
      security:
      - ClickwrapId: []
        Origin: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClickwrapPublicGetAPIResponse'
          description: Success
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Clickwrap agreement not found
          description: Not Found
      x-tagGroup: Clickwrap
  /api/v2.1/public/clickwrap/{clickwrap_public_id}/consent_status/:
    post:
      operationId: v2.1_public_clickwrap_consent_status_create
      description: "\nUsed to know if a particular user has given consent to a specific clickwrap.\n\nReturns one of the following values as consent status for the user.\n<table>\n    <thead>\n    <tr>\n        <th>Status field value</td>\n        <th>Details</td>\n    </tr>\n    </thead>\n    <tbody>\n        <tr>\n            <td>NOT_ACCEPTED</td>\n            <td>When the user hasn’t accepted this clickwrap before.</td>\n        </tr>\n        <tr>\n            <td>ACCEPTED_OLDER_VERSION</td>\n            <td>When the user has accepted the clickwrap, but a new published version exists.</td>\n        </tr>\n        <tr>\n            <td>ACCEPTED_LATEST_VERSION</td>\n            <td>When the user has accepted the latest published version of the clickwrap.</td>\n        </tr>\n    </tbody>\n</table>\n"
      summary: Get Consent Status
      parameters:
      - in: path
        name: clickwrap_public_id
        schema:
          type: string
          format: uuid
        description: Public Id of Clickwrap
        required: true
      tags:
      - V2.1 Clickwrap
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicGetClickwrapConsentStatusRequestData'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PublicGetClickwrapConsentStatusRequestData'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicGetClickwrapConsentStatusRequestData'
        required: true
      security:
      - ClientId: []
        ClientSecret: []
      - ClickwrapId: []
        Origin: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicClickwrapConsentStatusResponse'
          description: Success
      x-tagGroup: Clickwrap
  /api/v2.1/public/clickwrap/{clickwrap_public_id}/execute/:
    post:
      operationId: v2.1_public_clickwrap_execute_create
      description: Creates the clickwrap contract
      summary: Create Clickwrap Contract
      parameters:
      - in: path
        name: clickwrap_public_id
        schema:
          type: string
          format: uuid
        description: Public Id of Clickwrap
        required: true
      tags:
      - V2.1 Clickwrap
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClickwrapContractRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateClickwrapContractRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateClickwrapContractRequest'
        required: true
      security:
      - ClickwrapId: []
        Origin: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractMinimalResponseV2'
          description: Created
      x-tagGroup: Clickwrap
