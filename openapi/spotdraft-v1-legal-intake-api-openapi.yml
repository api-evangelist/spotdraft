      - created_at: '2025-01-15T10:00:00Z'
        created_by:
          designation: Legal
          email: jane@example.com
          id: 1
          name: Jane Doe
        description: Legal review for vendor NDA
        due_date: '2025-12-31T23:59:59Z'
        frozen_workflow:
          description: Standard NDA
          id: 100
          title: NDA Workflow
          type: INTAKE_WORKFLOW
          workflow_id: 1
        id: 1
        metadata: {}
        modified_at: '2025-01-15T10:00:00Z'
        priority: HIGH
        public_id: 10f9a299-9e9a-4bc9-9299-5b89bc06d370
        reference_id: I-001
        status: PENDING
        title: Review NDA
      properties:
        id:
          description: Id of the intake.
          title: Id
          type: integer
        title:
          description: Title of the intake.
          title: Title
          type: string
