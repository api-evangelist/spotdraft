          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Description of the intake.
          title: Description
        status:
          $ref: '#/components/schemas/LegalIntakeStatus'
          description: Current status of the intake.
        priority:
          $ref: '#/components/schemas/LegalIntakePriority'
          description: Priority of the intake.
        due_date:
          anyOf:
          - format: date-time
            type: string
