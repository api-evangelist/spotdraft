openapi: 3.2.0
info:
  title: SpotDraft V1 Legal Intake API
  version: v1
  x-version: v1
  x-logo:
    url: https://cdn.spotdraft.com/assets/logo-black-new.png
    backgroundColor: transparent
    altText: SpotDraft Logo
    href: https://spotdraft.com
  x-favicon: https://cdn.spotdraft.com/assets/favicon.png
  x-footer: © SpotDraft Inc. All rights reserved.
  description: '# SpotDraft Public API


    Welcome to the **SpotDraft Public API**.'
servers:
- url: https://api.eu.spotdraft.com
  description: Europe
- url: https://api.in.spotdraft.com
  description: India
- url: https://api.us.spotdraft.com
  description: United States
- url: https://api.me.spotdraft.com
  description: Middle East
tags:
- name: V1 Legal Intake
  description: Public legal intake endpoints for intake submission, detail, attachments, and tasks.
paths:
  /api/v1/public/legal_intake/:
    get:
      operationId: v1_public_legal_intake_retrieve
      description: Returns a paginated list of legal intakes for the authenticated user's workspace. Results are limited to intakes visible to the authenticated user in that workspace. Supports filtering, sorting, and text search via query parameters.
      summary: List Legal Intakes
      parameters:
      - in: query
        name: filter__priority
        schema:
          type: string
          enum:
          - HIGH
          - LOW
          - MEDIUM
        description: 'Filter by priority (exact match). Equivalent to filter__priority[$eq]=value. Allowed values: LOW, MEDIUM, HIGH.'
      - in: query
        name: filter__priority[$eq]
        schema:
          type: string
          enum:
          - HIGH
          - LOW
          - MEDIUM
        description: 'Filter by priority using $eq operator. Expects a single value for equality (e.g., string). Allowed values: LOW, MEDIUM, HIGH.'
      - in: query
        name: filter__priority[$in]
        schema:
          type: string
          enum:
          - HIGH
          - LOW
          - MEDIUM
        description: 'Filter by priority using $in operator. Expects a comma-separated list of values (e.g., val1,val2). Use \, to include literal commas in values. Allowed values: LOW, MEDIUM, HIGH.'
      - in: query
        name: filter__priority[$ne]
        schema:
          type: string
          enum:
          - HIGH
          - LOW
          - MEDIUM
        description: 'Filter by priority using $ne operator. Expects a single value for not-equal comparison (e.g., string). Allowed values: LOW, MEDIUM, HIGH.'
      - in: query
        name: filter__status
        schema:
          type: string
          enum:
          - BLOCKED
          - COMPLETED
          - DISCARDED
          - DRAFT
          - IN_PROGRESS
          - PENDING
        description: 'Filter by status (exact match). Equivalent to filter__status[$eq]=value. Allowed values: DRAFT, PENDING, IN_PROGRESS, BLOCKED, COMPLETED, DISCARDED.'
      - in: query
        name: filter__status[$eq]
        schema:
          type: string
          enum:
          - BLOCKED
          - COMPLETED
          - DISCARDED
          - DRAFT
          - IN_PROGRESS
          - PENDING
        description: 'Filter by status using $eq operator. Expects a single value for equality (e.g., string). Allowed values: DRAFT, PENDING, IN_PROGRESS, BLOCKED, COMPLETED, DISCARDED.'
      - in: query
        name: filter__status[$in]
        schema:
          type: string
          enum:
          - BLOCKED
          - COMPLETED
          - DISCARDED
          - DRAFT
          - IN_PROGRESS
          - PENDING
        description: 'Filter by status using $in operator. Expects a comma-separated list of values (e.g., val1,val2). Use \, to include literal commas in values. Allowed values: DRAFT, PENDING, IN_PROGRESS, BLOCKED, COMPLETED, DISCARDED.'
      - in: query
        name: filter__status[$ne]
        schema:
          type: string
          enum:
          - BLOCKED
          - COMPLETED
          - DISCARDED
          - DRAFT
          - IN_PROGRESS
          - PENDING
        description: 'Filter by status using $ne operator. Expects a single value for not-equal comparison (e.g., string). Allowed values: DRAFT, PENDING, IN_PROGRESS, BLOCKED, COMPLETED, DISCARDED.'
      - in: query
        name: limit
        schema:
          type: integer
          default: 50
        description: The number of items to return per page.
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: The page to return. Page numbers start at 1.
      - in: query
        name: query
        schema:
          type: string
        description: 'Search legal intake requests by keyword. This query performs a full-text search across main fields such as Title, Description, or Reference ID. Use keywords relevant to your request. For example: <code>?query=contract+review</code>.<br><br>Results will match legal intakes containing all specified keywords. '
      - in: query
        name: sort
        schema:
          type: string
        description: 'Sorting option for results. Use ''-field'' for descending or ''field''/''+field'' for ascending order. Supported values are `created_at`, `priority`, `status`, and `title`. Example: `sort=-created_at`. Only a single sort field is supported.'
      tags:
      - V1 Legal Intake
      security:
      - ClientId: []
        ClientSecret: []
      - OAuthBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalIntakePublicListResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                InvalidLimit:
                  value:
                    limit:
                    - Input should be less than or equal to 100
                  summary: Invalid limit
                InvalidSort:
                  value:
                    detail: Invalid sort field
                  summary: Invalid sort
                InvalidFilterValue:
                  value:
                    status:
                    - Value should be one of PENDING, IN_PROGRESS
                  summary: Invalid filter value
          description: Validation error for list query parameters. Returned when `page` or `limit` is invalid, when filter parameters are malformed or use unsupported values, or when `sort` is not one of the supported fields. Response body is a field-keyed validation object.
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error detail.
                required:
                - detail
              examples:
                Example:
                  value:
                    detail: Authentication credentials were not provided.
          description: 'Unauthorized — invalid or missing credentials. '
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error detail.
                required:
                - detail
              examples:
                Example:
                  value:
                    detail: You do not have permission to perform this action.
          description: 'Forbidden — workspace membership failed, intake access was denied, or the intake is not visible in this workspace. Intake-by-id routes intentionally return `403` instead of `404` for unknown or cross-workspace ids. Response body is ``{"detail": "..."}`` only.'
      x-tagGroup: Legal Intake
    post:
      operationId: v1_public_legal_intake_create
      description: 'Creates a new legal intake in the authenticated workspace from the latest

        published frozen version of the workflow identified by `workflow_id`.

        Optional `file_ids` are resolved against workspace files, and the response

        returns the created intake in the detailed legal intake response shape.'
      summary: Create Legal Intake
      tags:
      - V1 Legal Intake
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalIntakePublicCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LegalIntakePublicCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LegalIntakePublicCreateRequest'
        required: true
      security:
      - ClientId: []
        ClientSecret: []
      - OAuthBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalIntakePublicDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                InvalidPriority:
                  value:
                    priority:
                    - Input should be 'LOW', 'MEDIUM' or 'HIGH'
                  summary: Invalid priority
                MalformedAssigneeRow:
                  value:
                    assignees:
                      '0':
                        entity_id:
                        - Field required
                  summary: Malformed assignee row
                UnknownFileId:
                  value:
                    detail: One or more file_ids not found in workspace
                    status_code: 400
                    code: SD_PUBLIC_00039
                    message: One or more file_ids not found in workspace
                  summary: Unknown file id
                WorkflowHasNoPublishedVersion:
                  value:
                    detail: This workflow has no published version for the workspace
                    status_code: 400
                    code: SD_PUBLIC_00039
                    message: This workflow has no published version for the workspace
                  summary: Workflow has no published version
                WorkflowIsNotAnIntakeWorkflow:
                  value:
                    detail: This workflow is not an INTAKE_WORKFLOW
                    status_code: 400
                    code: SD_PUBLIC_00039
                    message: This workflow is not an INTAKE_WORKFLOW
                  summary: Workflow is not an intake workflow
          description: Invalid create request. This endpoint can return either a field-keyed validation object for malformed request payloads, or a SpotDraft public error object for create-domain failures such as unknown `file_ids`, a workflow with no published frozen version, or a workflow that is not an `INTAKE_WORKFLOW`.
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error detail.
                required:
                - detail
              examples:
                Example:
                  value:
                    detail: Authentication credentials were not provided.
          description: 'Unauthorized — invalid or missing credentials. '
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error detail.
                required:
                - detail
              examples:
                Example:
                  value:
                    detail: You do not have permission to perform this action.
          description: 'Forbidden — workspace membership failed, intake access was denied, or the intake is not visible in this workspace. Intake-by-id routes intentionally return `403` instead of `404` for unknown or cross-workspace ids. Response body is ``{"detail": "..."}`` only.'
      x-tagGroup: Legal Intake
  /api/v1/public/legal_intake/{legal_intake_id}/:
    get:
      operationId: v1_public_legal_intake_retrieve_2
      description: Returns the detailed legal intake for the provided id. Results are limited to intakes visible to the authenticated user in that workspace.
      summary: Get Legal Intake by ID
      parameters:
      - in: path
        name: legal_intake_id
        schema:
          type: integer
        description: Unique integer identifier of the legal intake request.<br>Required in the path for endpoints that operate on a specific legal intake.<br><br>
        required: true
      tags:
      - V1 Legal Intake
      security:
      - ClientId: []
        ClientSecret: []
      - OAuthBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalIntakePublicDetailResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error detail.
                required:
                - detail
              examples:
                Example:
                  value:
                    detail: Authentication credentials were not provided.
          description: 'Unauthorized — invalid or missing credentials. '
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error detail.
                required:
                - detail
              examples:
                Example:
                  value:
                    detail: You do not have permission to perform this action.
          description: 'Forbidden — workspace membership failed, intake access was denied, or the intake is not visible in this workspace. Intake-by-id routes intentionally return `403` instead of `404` for unknown or cross-workspace ids. Response body is ``{"detail": "..."}`` only.'
      x-tagGroup: Legal Intake
    patch:
      operationId: v1_public_legal_intake_partial_update
      description: 'Updates the specified legal intake. Only users with edit access can modify an intake. This operation uses PATCH and performs a partial update: only supplied fields are modified and omitted fields are left unchanged. Send `null` for nullable fields such as `description` or `due_date` to clear them.'
      summary: Update Legal Intake
      parameters:
      - in: path
        name: legal_intake_id
        schema:
          type: integer
        description: Unique integer identifier of the legal intake request.<br>Required in the path for endpoints that operate on a specific legal intake.<br><br>
        required: true
      tags:
      - V1 Legal Intake
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLegalIntakePublicUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLegalIntakePublicUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLegalIntakePublicUpdateRequest'
      security:
      - ClientId: []
        ClientSecret: []
      - OAuthBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalIntakePublicDetailResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                MalformedAssigneeRow:
                  value:
                    assignees:
                      '0':
                        entity_id:
                        - Field required
                  summary: Malformed assignee row
                InvalidPriority:
                  value:
                    priority:
                    - Input should be 'LOW', 'MEDIUM' or 'HIGH'
                  summary: Invalid priority
          description: Validation error for legal intake updates. Returned when the partial update payload is malformed or contains invalid enum values. Response body is a field-keyed validation object.
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error detail.
                required:
                - detail
              examples:
                Example:
                  value:
                    detail: Authentication credentials were not provided.
          description: 'Unauthorized — invalid or missing credentials. '
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error detail.
                required:
                - detail
              examples:
                Example:
                  value:
                    detail: You do not have permission to perform this action.
          description: 'Forbidden — workspace membership failed, intake access was denied, or the intake is not visible in this workspace. Intake-by-id routes intentionally return `403` instead of `404` for unknown or cross-workspace ids. Response body is ``{"detail": "..."}`` only.'
      x-tagGroup: Legal Intake
    delete:
      operationId: v1_public_legal_intake_destroy
      description: Soft deletes the specified legal intake.
      summary: Delete Legal Intake
      parameters:
      - in: path
        name: legal_intake_id
        schema:
          type: integer
        description: Unique integer identifier of the legal intake request.<br>Required in the path for endpoints that operate on a specific legal intake.<br><br>
        required: true
      tags:
      - V1 Legal Intake
      security:
      - ClientId: []
        ClientSecret: []
      - OAuthBearer: []
      responses:
        '204':
          content:
            application/json:
              schema:
                type:
                - object
                - 'null'
                description: No content.
          description: Success; empty response body.
        '401':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error detail.
                required:
                - detail
              examples:
                Example:
                  value:
                    detail: Authentication credentials were not provided.
          description: 'Unauthorized — invalid or missing credentials. '
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error detail.
                required:
                - detail
              examples:
                Example:
                  value:
                    detail: You do not have permission to perform this action.
          description: 'Forbidden — workspace membership failed, intake access was denied, or the intake is not visible in this workspace. Intake-by-id routes intentionally return `403` instead of `404` for unknown or cross-workspace ids. Response body is ``{"detail": "..."}`` only.'
      x-tagGroup: Legal Intake
components:
  schemas:
    LegalIntakePublicListResponse:
      description: Paginated list of legal intakes. Response schema for List legal intakes API.
      examples:
      - has_next: false
        has_previous: false
        intakes:
        - created_at: '2025-01-15T10:00:00Z'
          created_by:
            designation: Legal
            email: jane@example.com
            id: 1
            name: Jane Doe
          description: Legal review for vendor NDA
          due_date: '2025-12-31T23:59:59Z'
          frozen_workflow:
            description: Standard NDA
            id: 100
            title: NDA Workflow
            type: INTAKE_WORKFLOW
            workflow_id: 1
          id: 1
          metadata: {}
          modified_at: '2025-01-15T10:00:00Z'
          priority: HIGH
          public_id: 10f9a299-9e9a-4bc9-9299-5b89bc06d370
          reference_id: I-001
          status: PENDING
          title: Review NDA
        limit: 50
        page: 1
        total_count: 1
        total_pages: 1
      properties:
        intakes:
          description: List of legal intake response objects for the current page.
          items:
            $ref: '#/components/schemas/LegalIntakePublicListItemResponse'
          title: Intakes
          type: array
        total_count:
          description: Total matching intakes across pages.
          title: Total Count
          type: integer
        page:
          description: Current page number.
          title: Page
          type: integer
        limit:
          description: Page size used for this response.
          title: Limit
          type: integer
        total_pages:
          description: Total number of pages for the current query.
          title: Total Pages
          type: integer
        has_next:
          description: Whether a next page exists.
          title: Has Next
          type: boolean
        has_previous:
          description: Whether a previous page exists.
          title: Has Previous
          type: boolean
      required:
      - intakes
      - total_count
      - page
      - limit
      - total_pages
      - has_next
      - has_previous
      title: LegalIntakePublicListResponse
      type: object
    WorkflowType:
      enum:
      - TEMPLATE_WORKFLOW
      - UPLOAD_WORKFLOW
      - INTAKE_WORKFLOW
      title: WorkflowType
      type: string
    LegalIntakeAssigneePublicCreateRequest:
      description: Request model for creating an assignee for a legal intake.
      examples:
      - assignee_type: ASSIGNED_TO
        entity_id: '1'
        entity_type: ORG_USER
      properties:
        entity_id:
          description: Id of the assignee entity (organization user id as a string).
          minLength: 1
          title: Entity Id
          type: string
        entity_type:
          allOf:
          - $ref: '#/components/schemas/EntityTypeEnum'
          const: ORG_USER
          description: Type of assignee entity. Only ORG_USER is supported in the public API.
          title: Entity Type
        assignee_type:
          $ref: '#/components/schemas/LegalIntakeAssigneeType'
          description: 'Relationship to the intake: ASSIGNED_TO or COLLABORATOR.'
      required:
      - entity_id
      - entity_type
      - assignee_type
      title: LegalIntakeAssigneePublicCreateRequest
      type: object
    TaskPriority:
      enum:
      - LOW
      - MEDIUM
      - HIGH
      title: TaskPriority
      type: string
    LegalIntakeAssigneeEntityType:
      enum:
      - ORG_USER
      - ROLE
      title: LegalIntakeAssigneeEntityType
      type: string
    LegalIntakeStatus:
      enum:
      - DRAFT
      - PENDING
      - IN_PROGRESS
      - BLOCKED
      - COMPLETED
      - DISCARDED
      title: LegalIntakeStatus
      type: string
    LegalIntakeAssigneeType:
      enum:
      - ASSIGNED_TO
      - COLLABORATOR
      title: LegalIntakeAssigneeType
      type: string
    PublicOrgUserResponse:
      properties:
        id:
          description: Id of the user.
          title: Id
          type: integer
        name:
          description: Name of the user.
          title: Name
          type: string
        email:
          description: Email of the user.
          title: Email
          type: string
        designation:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Designation of the user.
          title: Designation
      required:
      - id
      - name
      - email
      title: PublicOrgUserResponse
      type: object
    LegalIntakeAssigneePublicResponse:
      description: Assignee or collaborator in a legal intake response.
      properties:
        entity_id:
          description: Id of the entity assigned to the intake.
          title: Entity Id
          type: string
        entity_type:
          $ref: '#/components/schemas/LegalIntakeAssigneeEntityType'
          description: Type of the entity assigned to the intake.
        assignee_type:
          $ref: '#/components/schemas/LegalIntakeAssigneeType'
          description: Type of the assignee.
        assignee_org_user:
          anyOf:
          - $ref: '#/components/schemas/PublicOrgUserResponse'
          - type: 'null'
          default: null
          description: User details when entity_type is ORG_USER.
      required:
      - entity_id
      - entity_type
      - assignee_type
      title: LegalIntakeAssigneePublicResponse
      type: object
    LegalIntakePriority:
      enum:
      - LOW
      - MEDIUM
      - HIGH
      title: LegalIntakePriority
      type: string
    LegalIntakeAttachmentPublicResponse:
      description: Lightweight attachment metadata exposed by the public detail API.
      properties:
        uuid:
          description: Stable UUID for the attached workspace file.
          format: uuid
          title: Uuid
          type: string
        name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Original filename of the attached workspace file.
          title: Name
      required:
      - uuid
      title: LegalIntakeAttachmentPublicResponse
      type: object
    LegalIntakePublicDetailResponse:
      description: Detailed legal intake response used by public get/create/update APIs.
      examples:
      - assignees:
        - assignee_org_user:
            designation: Legal
            email: jane@example.com
            id: 1
            name: Jane Doe
          assignee_type: ASSIGNED_TO
          entity_id: '1'
          entity_type: ORG_USER
        attachments:
        - name: nda.pdf
          uuid: 10f9a299-9e9a-4bc9-9299-5b89bc06d370
        - name: vendor-msa.docx
          uuid: 9831fa6f-1d6c-4f8e-8fba-83d68765ca20
        collaborators:
        - assignee_type: COLLABORATOR
          entity_id: '1'
          entity_type: ORG_USER
        created_at: '2025-01-15T10:00:00Z'
        created_by:
          designation: Legal
          email: jane@example.com
          id: 1
          name: Jane Doe
        description: Legal review for vendor NDA
        due_date: '2025-12-31T23:59:59Z'
        frozen_workflow:
          description: Standard NDA
          id: 100
          title: NDA Workflow
          type: INTAKE_WORKFLOW
          workflow_id: 1
        id: 1
        metadata: {}
        modified_at: '2025-01-15T10:00:00Z'
        priority: HIGH
        public_id: 10f9a299-9e9a-4bc9-9299-5b89bc06d370
        reference_id: I-001
        status: PENDING
        tasks:
        - absolute_due_date: '2025-12-20T17:00:00Z'
          id: 101
          intake_task_status: PENDING
          notes: Friday EOD
          priority: HIGH
          reference_id: T-0101
          status: UPCOMING
          title: Sign the document
        title: Review NDA
      properties:
        id:
          description: Id of the intake.
          title: Id
          type: integer
        title:
          description: Title of the intake.
          title: Title
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Description of the intake.
          title: Description
        status:
          $ref: '#/components/schemas/LegalIntakeStatus'
          description: Current status of the intake.
        priority:
          $ref: '#/components/schemas/LegalIntakePriority'
          description: Priority of the intake.
        due_date:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          description: Target completion time for the intake, if set.
          title: Due Date
        metadata:
          anyOf:
          - type: object
          - type: 'null'
          default: null
          description: Custom metadata stored on the intake.
          title: Metadata
        public_id:
          description: Stable public UUID for the intake.
          format: uuid
          title: Public Id
          type: string
        reference_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: Human-readable reference for the intake (e.g. sequential id).
          title: Reference Id
        created_by:
          anyOf:
          - $ref: '#/components/schemas/PublicOrgUserResponse'
          - type: 'null'
          default: null
          description: User details for the intake creator.
        created_at:
          description: When the intake was created.
          format: date-time
          title: Created At
          type: string
        modified_at:
          description: When the intake was last updated.
          format: date-time
          title: Modified At
          type: string
        frozen_workflow:
          anyOf:
          - $ref: '#/components/schemas/FrozenWorkflowPublicResponse'
          - type: 'null'
          default: null
          description: Frozen workflow snapshot linked to this intake.
        assignees:
          anyOf:
          - items:
