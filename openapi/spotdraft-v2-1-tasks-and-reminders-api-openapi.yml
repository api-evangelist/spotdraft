openapi: 3.2.0
info:
  title: SpotDraft V2.1 Tasks and Reminders API
  version: v1
  x-version: v1
  x-logo:
    url: https://cdn.spotdraft.com/assets/logo-black-new.png
    backgroundColor: transparent
    altText: SpotDraft Logo
    href: https://spotdraft.com
  x-favicon: https://cdn.spotdraft.com/assets/favicon.png
  x-footer: © SpotDraft Inc. All rights reserved.
  description: '# SpotDraft Public API


    Welcome to the **SpotDraft Public API**.'
servers:
- url: https://api.eu.spotdraft.com
  description: Europe
- url: https://api.in.spotdraft.com
  description: India
- url: https://api.us.spotdraft.com
  description: United States
- url: https://api.me.spotdraft.com
  description: Middle East
tags:
- name: V2.1 Tasks and Reminders
  description: Task and reminder workflows across public API versions.
paths:
  /api/v2.1/public/contracts/{contract_id}/tasks/bulk/:
    post:
      operationId: v2.1_public_contracts_tasks_bulk_create
      description: This API can be used to bulk create user tasks
      summary: V2.1 Bulk Create User Tasks
      parameters:
      - in: path
        name: contract_id
        schema:
          type: integer
        required: true
      tags:
      - V2.1 Tasks and Reminders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTaskCreateRequestList'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserTaskCreateRequestList'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserTaskCreateRequestList'
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTaskPublicResponseList'
          description: V2.1 User Tasks with Reminders List
      x-tagGroup: Platform
  /api/v2.1/public/user_tasks/:
    post:
      operationId: v2.1_public_user_tasks_create
      description: 'Creates one or more user tasks in SpotDraft.


        Validation notes:

        - For non-intake tasks, exactly one of `due_date` or `due_date_key_pointer_id` should be provided.

        - Each assignee must set exactly one of `org_user_id` or `role_id`.'
      summary: V2.1 Create User Tasks List
      tags:
      - V2.1 Tasks and Reminders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserTaskCreateRequest'
            examples:
              Example1:
                value:
                  title: test title
                  notes: test note
                  contract_id: 1
                  due_date: '2021-05-20T04:52:04Z'
                  assignees:
                  - org_user_id: 1
                  - role_id: 1
                  reminders:
                  - value: 10
                    type: DAYS
                summary: Example 1
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserTaskCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserTaskCreateRequest'
        required: true
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTaskPublicResponse'
          description: V2.1 User Tasks with Reminders List
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error detail.
                  status_code:
                    type: integer
                    description: HTTP status code.
                  code:
                    type: string
                    description: Application error code.
                  message:
                    type: string
                    description: Human-readable message.
                required:
                - detail
                - status_code
                - code
                - message
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error detail.
                  status_code:
                    type: integer
                    description: HTTP status code.
                  code:
                    type: string
                    description: Application error code.
                  message:
                    type: string
                    description: Human-readable message.
                required:
                - detail
                - status_code
                - code
                - message
          description: Forbidden
      x-tagGroup: Platform
components:
