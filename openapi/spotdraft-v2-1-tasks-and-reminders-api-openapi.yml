              campaign_id:
                title: Campaign Id
                type: integer
              campaign_v3_id:
                title: Campaign V3 Id
                type: integer
              express_template_id:
                title: Express Template Id
                type: integer
              contract_data_id:
                title: Contract Data Id
                type: integer
              contract_editable_document_id:
                title: Contract Editable Document Id
                type: integer
              created:
                title: Created
                type: string
                format: date-time
              created_by_workspace_id:
                title: Created By Workspace Id
                type: integer
              editor_client:
                title: ContractEditorClient
                description: An enumeration.
                enum:
                - ONLY_OFFICE_NATIVE
                - WOPI
                - UNSET
