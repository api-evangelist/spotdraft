                type: integer
              public_id:
                title: Public Id
                type: string
              contract_name:
                title: Contract Name
                type: string
              contract_type_id:
                title: Contract Type Id
                type: integer
              contract_template_id:
                title: Contract Template Id
                type: integer
              status:
