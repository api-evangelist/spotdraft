                        first_name:
                          title: First Name
                          default: ''
                          type: string
                        last_name:
                          title: Last Name
                          default: ''
                          type: string
                        name:
                          title: Name
                          type: string
                        designation:
                          title: Designation
                          type: string
                        email:
                          title: Email
                          type: string
                        auth_user_id:
                          title: Auth User Id
                          type: integer
                        is_deleted:
                          title: Is Deleted
                          type: boolean
                        is_active:
                          title: Is Active
                          type: boolean
                        is_primary:
                          title: Is Primary
                          type: boolean
                        organization_id:
                          title: Organization Id
                          type: integer
                        invite_accepted:
                          title: Invite Accepted
                          type: boolean
                        phone_number:
                          title: Phone Number
                          type: object
                        identity_id:
                          title: Identity Id
                          type: string
                          format: uuid
                      required:
                      - id
                      - name
                      - email
                      - is_primary
                      - identity_id
