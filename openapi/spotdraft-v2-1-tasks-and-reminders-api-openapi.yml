                  title: TaskAssociationEntityType
                  description: The type of the entity for the task association
                  enum:
                  - OBLIGATION
                  - LEGAL_INTAKE
                  type: string
                association_type:
                  title: TaskAssociationType
                  description: The type of the association for the task association
                  enum:
                  - PRIMARY
                  - SECONDARY
                  type: string
                  default: PRIMARY
        required:
        - title
        - assignees
        examples:
        - title: test title
          notes: test note
          contract_id: 1
          due_date: '2021-05-20T04:52:04Z'
          assignees:
          - org_user_id: 1
          - role_id: 1
          reminders:
          - value: 10
            type: DAYS
    IntakeTaskStatusEnum:
      enum:
      - PENDING
      - IN_PROGRESS
      - BLOCKED
      - COMPLETED
      - DISCARDED
      type: string
    UserTaskPublicResponseStatusEnum:
      enum:
      - COMPLETED
      - UPCOMING
