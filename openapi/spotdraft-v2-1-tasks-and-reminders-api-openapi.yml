              execution_date:
                title: Execution Date
                type: string
                format: date-time
              frozen_template_id:
                title: Frozen Template Id
                type: integer
              workflow_id:
                title: Workflow Id
                type: string
              workflow_name:
                title: Workflow Name
                type: string
            required:
            - id
            - public_id
            - contract_name
            - contract_type_id
            - status
            - display_status
            - display_status_without_on_hold_check
            - contract_kind
            - created
            - created_by_workspace_id
            - editor_client
            - workflow_id
          created_by_org_user:
            title: Created By Org User
            type: object
            properties:
              id:
                title: Id
                type: integer
              first_name:
                title: First Name
                default: ''
