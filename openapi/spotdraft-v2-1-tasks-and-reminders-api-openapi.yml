            type: array
            items:
              title: TaskAssigneeDomainModel
              type: object
              properties:
                id:
                  title: Id
                  type: integer
                user_task_id:
                  title: User Task Id
                  type: integer
                assignee_org_user:
                  title: Assignee Org User
                  type: object
                  properties:
