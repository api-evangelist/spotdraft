            - INTAKE_TASK
            type: string
            default: USER_TASK
          task_associations:
            title: Task Associations
            description: List of Task Associations for the Task
            type: array
            items:
              title: TaskAssociationPublicResponse
              type: object
              properties:
                entity_id:
                  title: Entity Id
                  description: Entity id of the task association
                  type: string
                entity_type:
                  title: TaskAssociationEntityType
                  description: Entity type of the task association
                  enum:
                  - OBLIGATION
                  - LEGAL_INTAKE
                  type: string
                association_type:
                  title: TaskAssociationType
                  description: Association type of the task association
                  enum:
                  - PRIMARY
                  - SECONDARY
                  type: string
              required:
              - entity_id
              - entity_type
              - association_type
          due_date_key_pointer_id:
