    ContractUploadForSignatureRequest:
      title: ContractUploadForSignatureRequest
      type: object
      properties:
        contract_name:
          title: Contract Name
          description: The name of the uploaded contract that is visible to users.
          type: string
        contract_type_id:
          title: Contract Type Id
          description: The ID of the contract type for this uploaded contract. Use the [Get Contract Types](#tag/V2-Contract-Type-APIs/operation/v2_public_contract_types_list) API to get this ID.
          type: integer
        file_name:
          title: File Name
          description: The name of the file being uploaded. This is used when the file is downloaded. Expected to be a fully qualified file name with an extension.
          minLength: 1
          type: string
        file_base64:
          title: File Base64
          description: The contents of the file as a base64 encoded string.
          minLength: 1
          type: string
        creator_organization_entity_id:
          title: Creator Organization Entity Id
          description: The ID of the organization entity for the creator party of the uploaded contract. Use the [Get Organization Entities](#tag/V2-Organization-APIs/operation/v2_public_organizations_entities_list) API to get this ID.
          type: integer
        counterparty_organization_name:
          title: Counterparty Organization Name
          description: The name of the counter party's organization.
          type: string
        external_metadata:
          title: External Metadata
          type: object
          properties:
            id:
              title: Id
              description: Identifier of the record in the external system.
            integration_name:
              title: Integration Name
              description: Name of the external integration, for example Salesforce.
              type: string
            record_type:
              title: Record Type
              description: External record type, for example Opportunity or Account.
              type: string
            record_data:
              title: Record Data
              description: Arbitrary metadata payload from the external system.
              type: object
            object_configuration_id:
              title: Object Configuration Id
              description: Optional public identifier for a native integration object configuration. When provided, also send `record_type`. The API resolves and stores the corresponding internal entity reference.
              type: string
              format: uuid
          description: Optional external system metadata to associate with the uploaded contract.
        counterparty_is_individual:
          title: Counterparty Is Individual
          description: Defines if this Counterparty is an individual or an organization like a company. When not provided, the counterparty is treated as an organization.
          type: boolean
        counterparty_poc_details:
          title: Counterparty Poc Details
          type: object
          properties:
            first_name:
              title: First Name
              description: The first name of the Point of Contact
              type: string
            last_name:
              title: Last Name
              description: The last name of the Point of Contact
              type: string
            email:
              title: Email
              description: The email address of the Point of Contact
              type: string
          required:
          - first_name
          - last_name
          - email
          description: Point of Contact details for this counterparty. Should be the details of the individual for `counterparty_is_individual=True` and the details of the contact at the counterparty organization in case of `counterparty_is_individual=False`.
        intake_form_data:
          title: Intake Form Data
          description: A key-value object keyed by intake-form questionnaire field name. Values must match the question type configured on the upload workflow. Use the Intake Form Questionnaire API to discover the allowed field names and expected value shapes.
          type: object
        business_user_email:
          title: Business User Email
          description: The email address of the business user for the Upload for Sign contract.
          type: string
          format: email
        creator_signatories:
          title: Creator Signatories
          description: Details of the signatories on the creator party side.
          type: array
          items:
            title: CreatorPartySignatoryRequest
            type: object
            properties:
              email:
                title: Email
                description: Email of the signatory on the creator party side.
                type: string
                format: email
              title:
                title: Title
                description: Title of the signatory.
                default: ''
                type: string
              note:
                title: Note
                description: Note for the signatory
                type: string
            required:
            - email
      required:
      - contract_name
      - contract_type_id
      - file_name
      - file_base64
      - counterparty_organization_name
      examples:
      - contract_name: Acme Corporation NDA
        contract_type_id: 1
        file_name: Acme_nda.pdf
        file_base64: base64 encoded string of the PDF file
        creator_organization_entity_id: 1
        counterparty_organization_name: Acme Corporation
        external_metadata:
          id: hubspot-deal-10024
          integration_name: HubSpot
          record_type: Deal
          record_data:
            deal_stage: contractsent
            owner_email: owner@acme.example
        counterparty_is_individual: false
        counterparty_poc_details:
          first_name: Avery
          last_name: Stone
          email: legal@acme.example
        intake_form_data:
          term:
            days: 180
            type: MONTHS
            value: 6
          notes: Customer requested revised indemnity clause.
          capacity: 15
          setup_fee:
            type: USD
            value: 30000.0
          start_date: '2026-04-01'
          payment_method: annual_invoice
        business_user_email: owner@spotdraft.example
    ExtractionStatusEnum:
      enum:
      - completed
      - pending
      - failed
      - not_available
      type: string
    PublicDownloadContractDocxRequest:
      title: PublicDownloadContractDocxRequest
      type: object
      properties:
        fallback_to_last_available_docx:
          title: Fallback To Last Available Docx
          description: 'Whether to fallback to last available DOCX version if current contract version is not in DOCX format. Note: This might return an outdated DOCX version if the current version which is being used is in a different format (e.g., PDF). The returned DOCX may not reflect recent changes made in the current version.'
          default: false
          type: boolean
    DownloadLinkRequest:
      description: Request body for Get Contract Download Link API. Optional; defaults to PDF if omitted.
      properties:
        format:
          anyOf:
          - $ref: '#/components/schemas/EditableDocumentDownloadFormat'
          - type: 'null'
          default: PDF
          description: Download format for the contract file. Defaults to `PDF` when omitted.
      title: DownloadLinkRequest
      type: object
    GenerateContractPreviewRequest:
      title: GenerateContractPreviewRequest
      type: object
      properties:
        contract_template_id:
          title: Contract Template Id
          description: ID of the SpotDraft contract template used to render the preview.
          type: integer
        contract_data:
          title: Contract Data
          description: 'A key-value object where each key must match a template field name from the contract template.


            Values should use the data type expected by that template field. Common patterns include:

            - `string`: free-form text

            - `number`: integer or decimal values

            - `boolean`: `true` or `false`

            - `date`: `YYYY-MM-DD`

            - `datetime`: ISO 8601 timestamp such as `2026-03-28T10:15:00Z`

            - `duration`: `{ "type": "MONTHS" | "YEARS" | "DAYS", "value": number, "days": number }`

            - `currency`: `{ "type": "USD" | "INR" | ... , "value": number }`

            - `dropdown`: the selected option value as configured in the template

            - `multi_select`: an array of selected option values

            - `address`: an object such as `{ "line_one": ..., "city": ..., "country": ..., "zipcode": ... }`

            - `repeating`: an array of row objects for repeating groups or dynamic tables

            - `file`: a file object or uploaded file reference where the workflow supports attachments


            Use template field names exactly as configured in SpotDraft.'
          type: object
        organization_entity_id:
          title: Organization Entity Id
          description: Optional creator organization entity id used while rendering the preview.
          type: integer
        counter_party_details:
          title: Counter Party Details
          description: Optional counterparties used to render counterparty variables in the preview. For organizational counterparties, `organization_name` is required.
          type: array
          items:
            title: CounterPartyDetails
            type: object
            properties:
              is_individual:
                title: Is Individual
                description: Defines if this Counterparty is an individual or an organization like a company
                type: boolean
              organization_type:
                title: Organization Type
                description: The type of the counterparty if it is an organization. Expects values like LLC, LLP, etc. Please ask help@spotdraft.com for valid values.
                type: string
              organization_name:
                title: Organization Name
                description: The name of the counterparty if it is an organization. Expects the name of the company/entity that is the counterparty. Required when `is_individual=false`.
                type: string
              organization_details:
                title: Organization Details
                type: object
                properties:
                  jurisdiction:
                    title: Jurisdiction
                    description: The jurisdiction to which this organization belongs. Valid values are defined internally. Please reach out to help@spotdraft.com for a list.
                    type: string
                  address:
                    title: Address
                    type: object
                    properties:
                      city:
                        title: City
                        description: The city name for this address.
                        type: string
                      state:
                        title: State
                        description: The state name for this address.
                        default: ''
                        type: string
                      country:
                        title: Country
                        description: The name of the country associated with this counterparty address. Any value passed here is ignored if `country_iso_code` is passed. Valid values are defined internally. Please ask help@spotdraft.com for more information.
                        type: string
                      zipcode:
                        title: Zipcode
                        description: The zip/pin/postal code for this address.
                        default: ''
                        type: string
                      line_one:
                        title: Line One
                        description: The first line of the address. Usually the apartment, floor, and street information.
                        type: string
                      line_two:
                        title: Line Two
                        description: The second address line (if any).
                        type: string
                      email:
                        title: Email
                        description: The email address associated with this counterparty address (if any).
                        type: string
                      phone:
                        title: Phone
                        description: The phone number associated with this counterparty address (if any).
                        type: string
                      gst_number:
                        title: Gst Number
                        description: The GST Number for this Organization. Can be unset if not available or applicable.
                        type: string
                      tax_id:
                        title: Tax Id
                        description: The VAT/GST/Sales Tax/etc ID for this Organization.
                        type: string
                      country_iso_code:
                        title: Country Iso Code
                        description: The ISO-3166-1 Alpha-2 code of the country associated with this counterparty address. Any value passed here is overrides `country`. Valid values can be found [here](https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes).
                        type: string
                    required:
                    - city
                    - country
                    - line_one
                    description: The primary address for this organization (if any)
                description: Additional details for an organization. Should be set if `is_individual=False`
              poc_details:
                title: Poc Details
                type: object
                properties:
                  first_name:
                    title: First Name
                    description: The first name of the Point of Contact
                    type: string
                  last_name:
                    title: Last Name
                    description: The last name of the Point of Contact
                    type: string
                  email:
                    title: Email
                    description: The email address of the Point of Contact
                    type: string
                required:
                - first_name
                - last_name
                - email
                description: Point of Contact details for this counterparty. Should be the details of the individual for `is_individual=True` and the details of the contact at the counterparty organization in case of `is_individual=False`.
              party_role_identifier:
                title: Party Role Identifier
                description: The unique identifier of the party this counterparty should be assigned to.
                minLength: 1
                type: string
            required:
            - is_individual
            - poc_details
            examples:
            - is_individual: true
              organization_type: Private Limited
              organization_name: Acme Corporation
              organization_details: {}
              poc_details:
                first_name: Mike
                last_name: Reed
                email: Mike_reed@yahoo.com
              primary_address:
                city_name: Cincinnati
                state_name: Ohio
                country_name: USA
                zipcode: '513'
                line_one: 'st: 3, block: 2, Jenkins Road'
      required:
      - contract_template_id
      - contract_data
      example:
        contract_template_id: 1204
        contract_data:
          agreement_date: '2026-03-28'
          renewal_review_at: '2026-09-15T10:30:00Z'
          customer_name: Acme Inc.
          billing_currency:
            type: USD
            value: 12000
          subscription_term:
            type: MONTHS
            value: 12
            days: 365
          auto_renewal: true
          notice_period_days: 30
          service_countries:
          - US
          - IN
          billing_address:
            line_one: 350 Fifth Avenue
            city: New York
            state: NY
            country: United States
            zipcode: '10118'
          pricing_schedule:
          - milestone: Implementation
            amount:
              type: USD
              value: 5000
          - milestone: Annual subscription
            amount:
              type: USD
              value: 7000
          msa_attachment:
            file_name: security-schedule.pdf
            content_type: application/pdf
        counter_party_details:
        - is_individual: false
          organization_type: company
          organization_name: Acme Inc.
          poc_details:
            first_name: Avery
            last_name: Stone
            email: legal@acme.example
