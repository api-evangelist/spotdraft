          description: Date and time when the Counterparty updated contract data
          type: string
          format: date-time
        cp_opened_review_email_datetime:
          title: Cp Opened Review Email Datetime
          description: Date and time when the Counterparty opened the contract review email for the first time
          type: string
          format: date-time
        contract_signed_by_signatory_list:
          title: Contract Signed By Signatory List
          description: List of signatories along with the date and time of signature.
          type: array
