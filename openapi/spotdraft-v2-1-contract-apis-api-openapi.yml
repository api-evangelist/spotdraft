      type: string
    ExternalCreateContractSignatory:
      type: object
      description: Defines the data that is required for create contract signatory
      properties:
        name:
          type: string
        email:
          type: string
        title:
          type: string
        is_counterparty_signatory:
          type: boolean
          description: Set this as True if the signatory belongs to a counterparty. Else set it as False.
        counterparty_name:
          type: string
          description: Required if `is_counterparty_signatory` is True. Must match the name of one of the counterparties in `counter_party_details`. If the counterparty `is_individual` is True, this should be the concatenation of the `first_name` and `last_name` from `poc_details` (e.g., 'John Doe'). If `is_individual` is False, this should match the `organization_name` of the counterparty.  If `is_counterparty_signatory` is False, leave this field blank.
        sign_order:
          type: integer
        note:
          type: string
      required:
      - email
      - is_counterparty_signatory
      - name
    ExternalContractRelationResponse:
      title: ExternalContractRelationResponse
      type: object
      properties:
        id:
          title: Id
          description: Contract Relation ID
          type: integer
        related_contract_id:
          title: Related Contract Id
          description: ID of the contract that is being related.
          type: integer
        relation_type:
          allOf:
          - $ref: '#/components/schemas/RelationTypeEnum'
          title: ContractRelationType
          description: Type of relationship established with the related contract.
        created:
          title: Created
          description: The date and time at which the contract relation was created
          type: string
          format: date-time
      required:
      - id
      - related_contract_id
      - relation_type
      - created
      examples:
      - id: 1000
        related_contract_id: 1234
        relation_type: CHILD
        created: '2021-05-20T04:52:04Z'
    ExternalRelatedContractListResponse:
      title: ExternalRelatedContractListResponse
      type: object
      properties:
        page:
          title: Page
          description: Current page number
          type: integer
        limit:
          title: Limit
          description: Number of results per page
          type: integer
        total_results:
          title: Total Results
          description: Total number of related contracts
          type: integer
        results:
          title: Results
          description: List of related contracts
          type: array
          items:
            title: ExternalRelatedContractResponse
            type: object
            properties:
              id:
                title: Id
                description: Contract Relation ID
                type: integer
              contract:
                title: Contract
                type: object
                properties:
                  id:
                    title: Id
                    description: ID of the related contract
                    type: integer
                  name:
                    title: Name
                    description: Name of the related contract
                    type: string
                  counter_party_list:
                    title: Counter Party List
                    description: List of counterparty names associated with the contract
                    type: array
                    items:
                      type: string
                  display_status:
                    title: ContractDisplayStatus
                    description: Current display status of the contract
                    enum:
                    - DRAFT
                    - REDLINING
                    - SIGN
                    - EXECUTED
                    - ON_HOLD
                    - VOIDED
                    type: string
                required:
                - id
                - name
                - counter_party_list
                - display_status
                description: Details of the related contract
              relation_type:
                title: Relation Type
                description: Type of relationship (CHILD, ADDENDUM, AMENDMENT, PARENT)
                type: string
            required:
            - id
            - contract
            - relation_type
            examples:
            - id: 1000
              contract:
                id: 1234
                name: Acme Corporation NDA
                counter_party_list:
                - Acme Corp
                display_status: EXECUTED
              relation_type: CHILD
      required:
      - page
      - limit
      - total_results
      - results
      examples:
      - page: 1
        limit: 10
        total_results: 2
        results:
        - id: 1000
          contract:
            id: 1234
            name: Acme Corporation NDA
            counter_party_list:
            - Acme Corp
            display_status: EXECUTED
          relation_type: CHILD
        - id: 1001
          contract:
            id: 5678
            name: Acme Corporation MSA
            counter_party_list:
            - Acme Corp
            display_status: DRAFT
          relation_type: AMENDMENT
    PublicSupportedDocumentCreateAPIRequest:
      title: PublicSupportedDocumentCreateAPIRequest
      type: object
      properties:
        name:
          title: Name
          description: Name of the document
          type: string
        file_name:
          title: File Name
          description: Name of the file, including its extension.
          type: string
        file_base64:
          title: File Base64
          description: The contents of the file as a base64 encoded string.
          type: string
      required:
      - name
      - file_name
      - file_base64
      examples:
      - name: Acme Corporation Related Document
        file_name: Acme Related Document.pdf
        file_base64: base64 encoded string of the file content
    ContractUnMarkForExecutionRequest:
      title: ContractUnMarkForExecutionRequest
      type: object
      properties:
        note:
          title: Note
          description: Optional note explaining the reason for un-marking the contract for execution.
          type: string
      examples:
      - note: Client requested some edits to the contract
    ExternalQuestionnaireResponseDomainModel:
      title: ExternalQuestionnaireResponseDomainModel
      type: object
      properties:
        data:
          title: Data
          description: The intake form questionnaire
          type: object
        created:
          title: Created
          description: The ISO timestamp when the intake form questionnaire was edited
          type: string
          format: date-time
      required:
      - data
      - created
      additionalProperties: false
      examples:
      - data:
          name: Admin
          is_individual: false
        created: '2009-08-06T00:00:00Z'
    ReviewRequestCreateRequest:
      title: ReviewRequestCreateRequest
      type: object
      properties:
        description:
          title: Description
          description: Description of the review request. Visible to the reviewer
          default: ''
          minLength: 1
          type: string
        assignee_user_id:
          title: Assignee User Id
          description: The ID of the org user to whom the review request should be assigned. Either `assignee_user_id` or `assignee_role_id` must be set, but not both.
          type: integer
        assignee_role_id:
          title: Assignee Role Id
          description: The ID of the role to which the review request should be assigned. Either `assignee_user_id` or `assignee_role_id` must be set, but not both.
          type: integer
    OrganizationDetailsSerializerV2_1:
      type: object
      description: Defines structure for organization details for API v2.1
      properties:
        jurisdiction:
          type: string
        address:
          $ref: '#/components/schemas/OrganizationAddressSerializerV2_1'
        jurisdiction_iso_code:
          type: string
    ExternalCreateContractResponse:
      type: object
      description: Response schema for v2/v2.1 create contract APIs.
      properties:
        id:
          type: string
          description: The ID of the contract on SpotDraft's platform.
        created:
          type: string
          format: date-time
          description: The timestamp at which this contract was first created.
        contract_name:
          type: string
          description: The name of the contract. Might be defaulted from the template or edited by the user.
        contract_link:
          type: string
          readOnly: true
          description: The link to the SpotDraft app where this contract can be viewed. The user will need to log in (and have view access) to be able to view the contract.
        contract_status:
          allOf:
          - $ref: '#/components/schemas/ContractDisplayStatusEnum'
          description: The status of this contract.
          readOnly: true
        created_by:
          type: string
          readOnly: true
          description: The email address of the user who created this contract.
        counter_party_name:
          type: string
          readOnly: true
          description: The name of the Counter Party for this contract.
        contract_type_name:
          type: string
          readOnly: true
          description: The type of Contract. The types are as defined by the Client.
        contract_type_id:
          type: integer
          readOnly: true
          description: The ID of the Contract Type.
        created_by_workspace:
          type: integer
          readOnly: true
          description: The workspace ID of the user who created or uploaded the executed contract on to SpotDraft's platform.
        external_metadata:
          type: object
          additionalProperties: {}
          readOnly: true
          description: The external metadata associated with this contract.
        reference_id:
          type: string
          readOnly: true
          description: The reference id of the contract.
        contract_id:
          type: integer
          description: The numeric internal contract ID.
      required:
      - contract_id
      - contract_link
      - contract_name
      - contract_status
      - contract_type_id
      - contract_type_name
      - counter_party_name
      - created
      - created_by
      - created_by_workspace
      - external_metadata
      - id
      - reference_id
    PatchedExternalUpdateContractBusinessUserRequest:
      title: ExternalUpdateContractBusinessUserRequest
      type: object
      properties:
        user_id:
          title: User Id
          description: The Org User Id of user who should be business user for the contract
          type: integer
        update_user_task_on_bu_update:
          title: Update User Task On Bu Update
          description: If true then all contract tasks (if any) will be re-assigned to new business user but if false they will remain assigned to old business user
          default: true
          type: boolean
      required:
      - user_id
      examples:
      - user_id: 1234
        update_user_task_on_bu_update: true
    DownloadUrl:
      type: object
      properties:
        url:
          type: string
          description: The URL from which this contract can be downloaded.
        file_name:
          type: string
          description: The file name of the contract.
        current_version_id:
          type: integer
          description: The ID of the current version of the contract.
      required:
      - file_name
      - url
