                format: date-time
              signatory_email:
                title: Signatory Email
                type: string
            required:
            - is_creator_party
            - signed_datetime
            - signatory_email
        contract_turns:
          title: ContractTurnsData
          type: object
          properties:
            manual_override_reason:
              title: Manual Override Reason
              description: Reason for contract pending with counterparty having a manual override.
              type: string
            last_turn_change_datetime:
              title: Last Turn Change Datetime
              description: Date and time when the contract turn was last changed.
              type: string
              format: date-time
            last_turn_change_org_user_email:
              title: Last Turn Change Org User Email
              description: User that caused the last turn change to happen.
              type: string
            no_of_turns:
              title: No Of Turns
              description: Number of turns recorded on this contract.
              default: 0
              type: integer
        contract_executed_datetime:
          title: Contract Executed Datetime
          description: Date and time when the contract was executed.
          type: string
          format: date-time
        type_of_workflow:
          title: Type Of Workflow
          description: Contract kind.
          type: string
        contract_status:
          title: Contract Status
          description: Current status of contract.
          type: string
        marked_for_signature_datetime:
          title: Marked For Signature Datetime
          description: Date and time when the contract was made ready to accept signatures.
          type: string
          format: date-time
        pending_with:
          allOf:
          - $ref: '#/components/schemas/PendingWithEnum'
          title: ContractPendingWith
          description: Contract pending with party.
      required:
      - contract_id
      - contract_turns
      examples:
      - contract_id: 1234
        contract_sent_to_cp_datetime: '2019-08-24T14:15:22Z'
        cp_added_info_initial_datetime: '2019-08-24T14:15:22Z'
        cp_added_info_latest_datetime: '2019-08-24T14:15:22Z'
        cp_opened_review_email_datetime: '2019-08-24T14:15:22Z'
        contract_signed_by_signatory_list:
        - is_creator_party: true
          signed_datetime: '2019-08-24T14:15:22Z'
          signatory_email: Mike_reed@yahoo.com
        contract_turns:
          manual_override_reason: Reason for manual override
          last_turn_change_datetime: '2019-08-24T14:15:22Z'
          last_turn_change_org_user_email: johndoe@example.com
          no_of_turns: 2
        contract_executed_datetime: '2019-08-24T14:15:22Z'
        type_of_workflow: UPLOAD_SIGN
        contract_status: COMPLETED
        marked_for_signature_datetime: '2019-08-24T14:15:22Z'
        pending_with: COUNTER_PARTY
