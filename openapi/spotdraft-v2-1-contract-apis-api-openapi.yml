          title: Contract Name
          description: The name of the contract that is visible to users.
          type: string
        contract_link:
          title: Contract Link
          description: The Url to view the contract.
          type: string
        contract_status:
          title: Contract Status
          description: The status of the contract.
          type: string
        created_by:
          title: Created By
          description: The full name of user who created or uploaded the executed contract on to SpotDraft's platform.
          type: string
        counter_party_name:
          title: Counter Party Name
          description: The full name of the counter party involved in the contract.
          type: string
        contract_type_name:
          title: Contract Type Name
          description: The type of the contract.
          type: string
        contract_type_id:
          title: Contract Type Id
          description: The ID of the contract type.
          type: integer
        external_metadata:
          title: External Metadata
          type: object
        reference_id:
          title: Reference Id
          type: string
        created_by_user_name:
          title: Created By User Name
          description: The full name of user who created or uploaded the executed contract on to SpotDraft's platform.
          type: string
        created_by_user_email:
          title: Created By User Email
          description: The email of user who created or uploaded the executed contract on to SpotDraft's platform.
          type: string
        created_by_workspace:
          title: Created By Workspace
          description: The workspace ID of the user who created or uploaded the executed contract on to SpotDraft's platform.
          type: integer
      required:
      - id
