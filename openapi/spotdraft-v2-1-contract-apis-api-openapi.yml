        contract_status:
          allOf:
          - $ref: '#/components/schemas/ContractDisplayStatusEnum'
          description: 'The status of this contract.


            * `DRAFT` - DRAFT

            * `REDLINING` - REDLINING

            * `SIGN` - SIGN

            * `EXECUTED` - EXECUTED

            * `ON_HOLD` - ON_HOLD

            * `VOIDED` - VOIDED'
        contract_name:
          type: string
          description: The name of the contract that is visible to users.
      required:
      - contract_name
      - contract_status
