      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractUploadForSignatureRequest'
            examples:
              UploadForSignatureRequest:
                value:
                  contract_name: Acme Corporation NDA
                  contract_type_id: 1
                  file_name: Acme_nda.pdf
                  file_base64: base64 encoded string of the PDF file
                  creator_organization_entity_id: 1
