    CreateExecutedContractAPIRequest:
      title: CreateExecutedContractAPIRequest
      type: object
      properties:
        contract_name:
          title: Contract Name
          description: The display name of the executed contract that is visible to users. This is caller-provided metadata and is not inferred from file contents.
          type: string
        file_name:
          title: File Name
          description: The name of the file being uploaded. This is used when the file is downloaded. Expected to be a fully qualified file name with an extension. Only `.pdf` files are accepted.
          type: string
        file_content:
          title: File Content
          description: The contents of the file as a base64 encoded string. The decoded file must be a valid PDF.
          type: string
        contract_type_id:
          title: Contract Type Id
          description: 'The ID of the contract type for this executed contract. Use the [Get Contract Types](#tag/v2-contract-types/GET/api/v2/public/contract_types/) API to get this ID. '
          type: integer
        organization_entity_id:
          title: Organization Entity Id
          description: 'The ID of the organization entity for this executed contract. Use the [Get Organization Entity](#tag/v21-organizations/GET/api/v2.1/public/organizations/entities/) API to get this ID. '
          type: integer
        counterparty_details:
          title: Counterparty Details
          description: The list of counterparties involved in the executed contract. Counterparty naming values are caller-provided and used for display/association metadata.
          type: array
          items:
            title: CounterPartyDetails
            type: object
            properties:
              is_individual:
                title: Is Individual
                description: Defines if this Counterparty is an individual or an organization like a company
                type: boolean
              organization_type:
                title: Organization Type
                description: The type of the counterparty if it is an organization. Expects values like LLC, LLP, etc. Please ask help@spotdraft.com for valid values.
                type: string
              organization_name:
                title: Organization Name
                description: The name of the counterparty if it is an organization. Expects the name of the company/entity that is the counterparty. Required when `is_individual=false`.
                type: string
              organization_details:
                title: Organization Details
                type: object
                properties:
                  jurisdiction:
                    title: Jurisdiction
                    description: The jurisdiction to which this organization belongs. Valid values are defined internally. Please reach out to help@spotdraft.com for a list.
                    type: string
                  address:
                    title: Address
                    type: object
                    properties:
                      city:
                        title: City
                        description: The city name for this address.
                        type: string
                      state:
                        title: State
                        description: The state name for this address.
                        default: ''
                        type: string
                      country:
                        title: Country
                        description: The name of the country associated with this counterparty address. Any value passed here is ignored if `country_iso_code` is passed. Valid values are defined internally. Please ask help@spotdraft.com for more information.
                        type: string
                      zipcode:
                        title: Zipcode
                        description: The zip/pin/postal code for this address.
                        default: ''
                        type: string
                      line_one:
                        title: Line One
                        description: The first line of the address. Usually the apartment, floor, and street information.
                        type: string
                      line_two:
                        title: Line Two
                        description: The second address line (if any).
                        type: string
                      email:
                        title: Email
                        description: The email address associated with this counterparty address (if any).
                        type: string
                      phone:
                        title: Phone
                        description: The phone number associated with this counterparty address (if any).
                        type: string
                      gst_number:
                        title: Gst Number
                        description: The GST Number for this Organization. Can be unset if not available or applicable.
                        type: string
                      tax_id:
                        title: Tax Id
                        description: The VAT/GST/Sales Tax/etc ID for this Organization.
                        type: string
                      country_iso_code:
                        title: Country Iso Code
                        description: The ISO-3166-1 Alpha-2 code of the country associated with this counterparty address. Any value passed here is overrides `country`. Valid values can be found [here](https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes).
                        type: string
                    required:
                    - city
                    - country
                    - line_one
                    description: The primary address for this organization (if any)
                description: Additional details for an organization. Should be set if `is_individual=False`
              poc_details:
                title: Poc Details
                type: object
                properties:
                  first_name:
                    title: First Name
                    description: The first name of the Point of Contact
                    type: string
                  last_name:
                    title: Last Name
                    description: The last name of the Point of Contact
                    type: string
                  email:
                    title: Email
                    description: The email address of the Point of Contact
                    type: string
                required:
                - first_name
                - last_name
                - email
                description: Point of Contact details for this counterparty. Should be the details of the individual for `is_individual=True` and the details of the contact at the counterparty organization in case of `is_individual=False`.
              party_role_identifier:
                title: Party Role Identifier
                description: The unique identifier of the party this counterparty should be assigned to.
                minLength: 1
                type: string
            required:
            - is_individual
            - poc_details
            examples:
            - is_individual: true
              organization_type: Private Limited
              organization_name: Acme Corporation
              organization_details: {}
              poc_details:
                first_name: Mike
                last_name: Reed
                email: Mike_reed@yahoo.com
              primary_address:
                city_name: Cincinnati
                state_name: Ohio
                country_name: USA
                zipcode: '513'
                line_one: 'st: 3, block: 2, Jenkins Road'
        external_metadata:
          title: External Metadata
          type: object
          properties:
            id:
              title: Id
              description: Identifier of the record in the external system.
            integration_name:
              title: Integration Name
              description: Name of the external integration, for example Salesforce.
              type: string
            record_type:
              title: Record Type
              description: External record type, for example Opportunity or Account.
              type: string
            record_data:
              title: Record Data
              description: Arbitrary metadata payload from the external system.
              type: object
            object_configuration_id:
              title: Object Configuration Id
              description: Optional public identifier for a native integration object configuration. When provided, also send `record_type`. The API resolves and stores the corresponding internal entity reference.
              type: string
              format: uuid
          description: Optional external system metadata to associate with the executed contract.
      required:
      - contract_name
      - file_name
      - file_content
      - contract_type_id
      - organization_entity_id
      examples:
      - contract_name: Acme Corporation NDA
