      - AMENDMENT
      - PARENT
      type: string
    ExternalContractUserResponse:
      title: ExternalContractUserResponse
      type: object
      properties:
        user_id:
          title: User Id
          description: The Org User Id of user who is one users for the contract
          type: integer
        contract_id:
          title: Contract Id
          description: The contract id for which business user was updated
          type: integer
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          title: ContractUserType
          description: Type of contract user
      required:
      - user_id
      - contract_id
      - type
      examples:
      - user_id: 1234
        type: BUSINESS
        contract_id: 1234
    PatchedIntakeFormData:
      title: IntakeFormData
      description: A key-value object keyed by intake-form question field name. Values must match the question type configured on the contract type questionnaire.
      type: object
      additionalProperties: false
      examples:
      - term:
          days: 180
          type: MONTHS
          value: 6
        notes: Customer requested revised indemnity clause.
        capacity: 15
        setup_fee:
          type: USD
          value: 30000.0
        start_date: '2026-04-01'
        payment_method: annual_invoice
    PublicSupportedDocumentCreateAPIRequest:
      title: PublicSupportedDocumentCreateAPIRequest
      type: object
      properties:
        name:
          title: Name
          description: Name of the document
          type: string
        file_name:
          title: File Name
          description: Name of the file, including its extension.
          type: string
        file_base64:
          title: File Base64
          description: The contents of the file as a base64 encoded string.
          type: string
      required:
      - name
      - file_name
      - file_base64
      examples:
      - name: Acme Corporation Related Document
        file_name: Acme Related Document.pdf
        file_base64: base64 encoded string of the file content
    WorkflowConfig:
      type: object
      properties:
        auto_send_to_counterparty:
          type: boolean
          default: false
        api_only_contract_edits:
          type: boolean
          default: false
        skip_cp_info_collection:
          type: boolean
          default: false
        skip_creator_info_collection:
          type: boolean
          default: false
    ExternalContractStatus:
      type: object
      description: Defines the data that is required to show the status of a contract
