    PublicDownloadContractDocxRequest:
      title: PublicDownloadContractDocxRequest
      type: object
      properties:
        fallback_to_last_available_docx:
          title: Fallback To Last Available Docx
          description: 'Whether to fallback to last available DOCX version if current contract version is not in DOCX format. Note: This might return an outdated DOCX version if the current version which is being used is in a different format (e.g., PDF). The returned DOCX may not reflect recent changes made in the current version.'
          default: false
          type: boolean
    DownloadLinkRequest:
      description: Request body for Get Contract Download Link API. Optional; defaults to PDF if omitted.
      properties:
        format:
          anyOf:
          - $ref: '#/components/schemas/EditableDocumentDownloadFormat'
          - type: 'null'
          default: PDF
          description: Download format for the contract file. Defaults to `PDF` when omitted.
      title: DownloadLinkRequest
      type: object
    GenerateContractPreviewRequest:
      title: GenerateContractPreviewRequest
      type: object
      properties:
        contract_template_id:
          title: Contract Template Id
          description: ID of the SpotDraft contract template used to render the preview.
          type: integer
        contract_data:
          title: Contract Data
          description: 'A key-value object where each key must match a template field name from the contract template.


            Values should use the data type expected by that template field. Common patterns include:

            - `string`: free-form text

            - `number`: integer or decimal values

            - `boolean`: `true` or `false`

            - `date`: `YYYY-MM-DD`

            - `datetime`: ISO 8601 timestamp such as `2026-03-28T10:15:00Z`

            - `duration`: `{ "type": "MONTHS" | "YEARS" | "DAYS", "value": number, "days": number }`

            - `currency`: `{ "type": "USD" | "INR" | ... , "value": number }`

            - `dropdown`: the selected option value as configured in the template

            - `multi_select`: an array of selected option values

            - `address`: an object such as `{ "line_one": ..., "city": ..., "country": ..., "zipcode": ... }`

            - `repeating`: an array of row objects for repeating groups or dynamic tables

            - `file`: a file object or uploaded file reference where the workflow supports attachments


            Use template field names exactly as configured in SpotDraft.'
          type: object
        organization_entity_id:
          title: Organization Entity Id
          description: Optional creator organization entity id used while rendering the preview.
          type: integer
        counter_party_details:
          title: Counter Party Details
          description: Optional counterparties used to render counterparty variables in the preview. For organizational counterparties, `organization_name` is required.
          type: array
          items:
            title: CounterPartyDetails
            type: object
            properties:
              is_individual:
                title: Is Individual
                description: Defines if this Counterparty is an individual or an organization like a company
                type: boolean
              organization_type:
                title: Organization Type
                description: The type of the counterparty if it is an organization. Expects values like LLC, LLP, etc. Please ask help@spotdraft.com for valid values.
                type: string
              organization_name:
                title: Organization Name
                description: The name of the counterparty if it is an organization. Expects the name of the company/entity that is the counterparty. Required when `is_individual=false`.
                type: string
              organization_details:
                title: Organization Details
                type: object
                properties:
                  jurisdiction:
                    title: Jurisdiction
                    description: The jurisdiction to which this organization belongs. Valid values are defined internally. Please reach out to help@spotdraft.com for a list.
                    type: string
                  address:
                    title: Address
                    type: object
                    properties:
                      city:
                        title: City
                        description: The city name for this address.
                        type: string
                      state:
                        title: State
                        description: The state name for this address.
                        default: ''
                        type: string
                      country:
                        title: Country
                        description: The name of the country associated with this counterparty address. Any value passed here is ignored if `country_iso_code` is passed. Valid values are defined internally. Please ask help@spotdraft.com for more information.
                        type: string
                      zipcode:
                        title: Zipcode
                        description: The zip/pin/postal code for this address.
                        default: ''
                        type: string
                      line_one:
                        title: Line One
                        description: The first line of the address. Usually the apartment, floor, and street information.
                        type: string
                      line_two:
                        title: Line Two
                        description: The second address line (if any).
                        type: string
                      email:
                        title: Email
                        description: The email address associated with this counterparty address (if any).
                        type: string
                      phone:
                        title: Phone
                        description: The phone number associated with this counterparty address (if any).
                        type: string
                      gst_number:
                        title: Gst Number
                        description: The GST Number for this Organization. Can be unset if not available or applicable.
                        type: string
                      tax_id:
                        title: Tax Id
                        description: The VAT/GST/Sales Tax/etc ID for this Organization.
                        type: string
                      country_iso_code:
                        title: Country Iso Code
                        description: The ISO-3166-1 Alpha-2 code of the country associated with this counterparty address. Any value passed here is overrides `country`. Valid values can be found [here](https://en.wikipedia.org/wiki/List_of_ISO_3166_country_codes).
                        type: string
                    required:
                    - city
                    - country
                    - line_one
                    description: The primary address for this organization (if any)
                description: Additional details for an organization. Should be set if `is_individual=False`
              poc_details:
                title: Poc Details
                type: object
                properties:
                  first_name:
                    title: First Name
                    description: The first name of the Point of Contact
                    type: string
                  last_name:
                    title: Last Name
                    description: The last name of the Point of Contact
                    type: string
                  email:
                    title: Email
                    description: The email address of the Point of Contact
                    type: string
                required:
                - first_name
                - last_name
                - email
                description: Point of Contact details for this counterparty. Should be the details of the individual for `is_individual=True` and the details of the contact at the counterparty organization in case of `is_individual=False`.
              party_role_identifier:
                title: Party Role Identifier
                description: The unique identifier of the party this counterparty should be assigned to.
                minLength: 1
                type: string
            required:
            - is_individual
            - poc_details
            examples:
            - is_individual: true
              organization_type: Private Limited
              organization_name: Acme Corporation
              organization_details: {}
              poc_details:
                first_name: Mike
                last_name: Reed
                email: Mike_reed@yahoo.com
              primary_address:
                city_name: Cincinnati
                state_name: Ohio
                country_name: USA
                zipcode: '513'
                line_one: 'st: 3, block: 2, Jenkins Road'
      required:
      - contract_template_id
      - contract_data
      example:
        contract_template_id: 1204
        contract_data:
          agreement_date: '2026-03-28'
          renewal_review_at: '2026-09-15T10:30:00Z'
          customer_name: Acme Inc.
          billing_currency:
            type: USD
            value: 12000
          subscription_term:
            type: MONTHS
            value: 12
            days: 365
          auto_renewal: true
          notice_period_days: 30
          service_countries:
          - US
          - IN
          billing_address:
            line_one: 350 Fifth Avenue
            city: New York
            state: NY
            country: United States
            zipcode: '10118'
          pricing_schedule:
          - milestone: Implementation
            amount:
              type: USD
              value: 5000
          - milestone: Annual subscription
            amount:
              type: USD
              value: 7000
          msa_attachment:
            file_name: security-schedule.pdf
            content_type: application/pdf
        counter_party_details:
        - is_individual: false
          organization_type: company
          organization_name: Acme Inc.
          poc_details:
            first_name: Avery
            last_name: Stone
            email: legal@acme.example
    ExternalCreateContract:
      type: object
      description: Defines the data that is required for contract creation
      properties:
        contract_template_id:
          type: integer
          description: ID of the SpotDraft contract template used to generate the contract.
        contract_data:
          description: 'A key-value object where each key must match a template field name from the contract template.


            Values should use the data type expected by that template field. Common patterns include:

            - `string`: free-form text

            - `number`: integer or decimal values

            - `boolean`: `true` or `false`

            - `date`: `YYYY-MM-DD`

            - `datetime`: ISO 8601 timestamp such as `2026-03-28T10:15:00Z`

            - `duration`: `{ "type": "MONTHS" | "YEARS" | "DAYS", "value": number, "days": number }`

            - `currency`: `{ "type": "USD" | "INR" | ... , "value": number }`

            - `dropdown`: the selected option value as configured in the template

            - `multi_select`: an array of selected option values

            - `address`: an object such as `{ "line_one": ..., "city": ..., "country": ..., "zipcode": ... }`

            - `repeating`: an array of row objects for repeating groups or dynamic tables

            - `file`: a file object or uploaded file reference where the workflow supports attachments


            Use template field names exactly as configured in SpotDraft.'
        counter_party_details:
          type: array
          items:
            $ref: '#/components/schemas/ExternalCounterPartyDetails'
          description: A list of counterparties involved in the contract. At least one counterparty must be provided.
        external_metadata:
          description: Optional external system metadata to associate with the contract, such as a CRM or ERP record reference.
        entity_reference_id:
          type: string
          description: Optional creator organization entity reference ID. If omitted, SpotDraft uses the primary organization entity for the creator organization.
        workflow_config:
          $ref: '#/components/schemas/WorkflowConfig'
        send_to_counterparty_config:
          allOf:
          - $ref: '#/components/schemas/SendToCounterparty'
          description: Optional email-delivery settings to apply when sending the contract to counterparties.
        contract_name:
          type: string
          description: Optional contract display name. If omitted, SpotDraft derives the contract name from the workflow or template configuration.
        signatories:
          type: array
          items:
            $ref: '#/components/schemas/ExternalCreateContractSignatory'
          description: An optional list of signatories for the contract. If provided, each signatory must be associated with a counterparty specified in `counter_party_details`.
        is_embedded_contract:
          type: boolean
          default: false
          description: Set to true when the contract will be used in an embedded signing flow.
      required:
      - contract_data
      - contract_template_id
      - counter_party_details
    ExternalContractQuestionnairePublicResponse:
      title: ExternalContractQuestionnairePublicResponse
      type: object
      properties:
        questionnaire_response_data:
          title: Questionnaire Response Data
          description: Questionnaire response data for the contract.
          type: object
        respondents:
          title: Respondents
          description: List of users who answered the questionnaire.
          type: array
          items:
            title: ExternalContractQuestionnaireRespondentPublicData
            description: Respondent data for contract questionnaire responses
            type: object
            properties:
              created_at:
                title: Created At
                description: Time when the respondent filled the questionnaire for the contract
                type: string
                format: date-time
              created_by:
                title: Created By
                description: Respondent name who filled questionnaire for the contract
                type: string
              org_name:
                title: Org Name
                description: Name of the organization to which respondent belongs to.
                type: string
      required:
      - questionnaire_response_data
      examples:
      - questionnaire_response_data:
          department: product
        respondents:
        - created_at: '2023-06-14T10:46:15.205587Z'
          created_by: Mike Reed
          org_name: Acme Inc.
    DownloadUrl:
      type: object
      properties:
        url:
          type: string
          description: The URL from which this contract can be downloaded.
        file_name:
          type: string
          description: The file name of the contract.
        current_version_id:
          type: integer
          description: The ID of the current version of the contract.
      required:
      - file_name
      - url
    ExternalQuestionnaireResponseDomainModel:
      title: ExternalQuestionnaireResponseDomainModel
      type: object
      properties:
        data:
          title: Data
          description: The intake form questionnaire
          type: object
        created:
          title: Created
          description: The ISO timestamp when the intake form questionnaire was edited
          type: string
          format: date-time
      required:
      - data
      - created
      additionalProperties: false
      examples:
      - data:
          name: Admin
          is_individual: false
        created: '2009-08-06T00:00:00Z'
