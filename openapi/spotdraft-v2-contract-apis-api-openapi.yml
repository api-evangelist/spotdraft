openapi: 3.2.0
info:
  title: SpotDraft V2 Contract APIs API
  version: v1
  x-version: v1
  x-logo:
    url: https://cdn.spotdraft.com/assets/logo-black-new.png
    backgroundColor: transparent
    altText: SpotDraft Logo
    href: https://spotdraft.com
  x-favicon: https://cdn.spotdraft.com/assets/favicon.png
  x-footer: © SpotDraft Inc. All rights reserved.
  description: '# SpotDraft Public API


    Welcome to the **SpotDraft Public API**.'
servers:
- url: https://api.eu.spotdraft.com
  description: Europe
- url: https://api.in.spotdraft.com
  description: India
- url: https://api.us.spotdraft.com
  description: United States
- url: https://api.me.spotdraft.com
  description: Middle East
tags:
- name: V2 Contract APIs
  description: Contract creation, retrieval, updates, previews, downloads, uploads, and lifecycle actions across public API versions.
paths:
  /api/v2/public/contracts/:
    get:
      operationId: v2_public_contracts_retrieve
      description: 'Returns contracts visible to the current workspace.


        Use pagination, filter, and sort parameters to narrow the result set. Where supported by the version, contract metadata filters are also available.'
      summary: List Contracts
      parameters:
      - in: query
        name: filter__client_email_address
        schema:
          type: string
        description: Filters on the counter party email. Does an exact match.
      - in: query
        name: filter__client_name
        schema:
          type: string
        description: Filters on the counter party name. Does an exact match.
      - in: query
        name: limit
        schema:
          type: integer
          default: 10
        description: The number of items to return per page.
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: The page to return. Page numbers start at 1.
      tags:
      - V2 Contract APIs
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractListResponseV2'
              examples:
                Example:
                  value:
                    total_results: 2
                    page: 1
                    limit: 10
                    results:
                    - id: T-34211
                      created: '2021-05-20T04:52:04Z'
                      created_by: Acme
                      contract_link: https://app.spotdraft.com/contracts/v2/1234
                      contract_status: REDLINING
                      contract_name: Standard NDA
                      counter_party_name: Microsoft
                      contract_type_name: Standard NDA
                      contract_type_id: 100
                      reference_id: SD-1234
                      created_by_user_name: Elena Kagan
                      created_by_user_email: elena@acme.com
                      created_by_workspace: 1
                    - id: H-2342
                      created: '2021-05-10T04:42:00Z'
                      created_by: Apple
                      contract_link: https://app.spotdraft.com/contracts/v2/4322
                      contract_status: EXECUTED
                      contract_name: Standard NDA - With Apple
                      counter_party_name: Apple Inc.
                      contract_type_name: Standard NDA
                      contract_type_id: 100
                      reference_id: SD-4322
                      created_by_user_name: Sonia Sotomayor
                      created_by_user_email: sonia@apple.com
                      created_by_workspace: 1
          description: Contract List
      x-tagGroup: Contracts
    post:
      operationId: v2_public_contracts_create
      description: 'Creates a new contract from a SpotDraft template and returns the created contract.


        Provide the template id, contract data, and counterparty details needed to render the agreement. Use this endpoint when you want SpotDraft to generate the contract from structured data.


        Creates a new contract from a SpotDraft template and returns the created contract.


        Provide contract data, counterparty details, and any required signatories for the workflow.


        In signatories list, sign_order should be set for either all items or no items of the list. Additionally when

        sign_order is set for all items of signatories list then at-least one counter party signatory user should also be part

        of the list.


        The `contract_data` object must use **template field names as keys**. Each value should match the data type configured for that field in SpotDraft.


        | Field type | Expected value | Example |

        | ---------- | -------------- | ------- |

        | String / text | String | `"Acme Inc."` |

        | Multi-line text | String with line breaks if needed | `"Not applicable\nCustomer redlines pending"` |

        | Number | Integer or decimal | `15` or `3.14` |

        | Boolean / checkbox | Boolean | `true` |

        | Date | `YYYY-MM-DD` | `"2026-03-28"` |

        | Datetime | ISO 8601 timestamp | `"2026-09-15T10:30:00Z"` |

        | Dropdown | Selected option value | `"annual_invoice"` |

        | Multi-select | Array of selected option values | `["US", "IN"]` |

        | Currency | `{ "type": "", "value": number }` | `{ "type": "USD", "value": 12000 }` |

        | Duration | `{ "days": int, "type": "DAYS\|MONTHS\|YEARS", "value": int }` | `{ "days": 180, "type": "MONTHS", "value": 6 }` |

        | Address | Object with address fields | `{ "line_one": "350 Fifth Avenue", "city": "New York", "country": "United States" }` |

        | Repeating group | Array of row objects | `[{"milestone": "Implementation", "amount": {"type": "USD", "value": 5000}}]` |

        | File / attachment | File object or uploaded file reference supported by the workflow | `{ "file_name": "security-schedule.pdf", "content_type": "application/pdf" }` |


        Sample contract data:


        ```json

        {

        "agreement_date": "2026-03-28",

        "renewal_review_at": "2026-09-15T10:30:00Z",

        "customer_name": "Acme Inc.",

        "billing_currency": {"type": "USD", "value": 12000},

        "subscription_term": {"type": "MONTHS", "value": 12, "days": 365},

        "auto_renewal": true,

        "notice_period_days": 30,

        "service_countries": ["US", "IN"],

        "billing_address": {

        "line_one": "350 Fifth Avenue",

        "city": "New York",

        "state": "NY",

        "country": "United States",

        "zipcode": "10118"

        },

        "pricing_schedule": [

        {"milestone": "Implementation", "amount": {"type": "USD", "value": 5000}},

        {"milestone": "Annual subscription", "amount": {"type": "USD", "value": 7000}}

        ],

        "msa_attachment": {"file_name": "security-schedule.pdf", "content_type": "application/pdf"}

        }

        ```'
      summary: Create Contract
      parameters:
      - in: header
        name: user-email
        schema:
          type: string
        description: The email address of the user to act as (when using client-secret authentication). This header attributes actions taken using the API to the given user.
      tags:
      - V2 Contract APIs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalCreateContract'
            examples:
              CreateContractRequest:
                value:
                  contract_template_id: 1204
                  contract_data:
                    agreement_date: '2026-03-28'
                    renewal_review_at: '2026-09-15T10:30:00Z'
                    customer_name: Acme Inc.
                    billing_currency:
                      type: USD
                      value: 12000
                    subscription_term:
                      type: MONTHS
                      value: 12
                      days: 365
                    auto_renewal: true
                    notice_period_days: 30
                    service_countries:
                    - US
                    - IN
                    billing_address:
                      line_one: 350 Fifth Avenue
                      city: New York
                      state: NY
                      country: United States
                      zipcode: '10118'
                    pricing_schedule:
                    - milestone: Implementation
                      amount:
                        type: USD
                        value: 5000
                    - milestone: Annual subscription
                      amount:
                        type: USD
                        value: 7000
                    msa_attachment:
                      file_name: security-schedule.pdf
                      content_type: application/pdf
                  counter_party_details:
                  - is_individual: false
                    organization_type: company
                    organization_name: Acme Inc.
                    poc_details:
                      first_name: Avery
                      last_name: Stone
                      email: legal@acme.example
                    organization_details:
                      jurisdiction: Delaware
                      address:
                        line_one: 350 Fifth Avenue
                        city: New York
                        state: NY
                        country: United States
                        zipcode: '10118'
                  external_metadata:
                    id: hubspot-deal-10024
                    integration_name: HubSpot
                    record_type: Deal
                    record_data:
                      deal_stage: contractsent
                      owner_email: owner@acme.example
                  contract_name: Acme Master Services Agreement
                summary: Create contract request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExternalCreateContract'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExternalCreateContract'
        required: true
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalCreateContractResponse'
          description: ''
      x-tagGroup: Contracts
  /api/v2/public/contracts/by_external_metadata/{external_metadata_id}:
    get:
      operationId: v2_public_contracts_by_external_metadata_retrieve
      description: 'Returns up to 50 contracts linked to the supplied external metadata id.


        Use this when you have an external system record id and need to find the related SpotDraft contracts.'
      summary: List Contracts by External Metadata ID
      parameters:
      - in: path
        name: external_metadata_id
        schema:
          type: string
        description: External Metadata ID of the Contract. This can be used to search for contracts based on an ID specified when creating the contract using the external API.
        required: true
      tags:
      - V2 Contract APIs
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalContractV3'
              examples:
                Example:
                  value:
                  - - id: T-34211
                      created: '2021-05-20T04:52:04Z'
                      created_by: Acme
                      contract_link: https://app.spotdraft.com/contracts/v2/1234
                      contract_status: REDLINING
                      contract_name: Standard NDA
                      counter_party_name: Microsoft
                      contract_type_name: Standard NDA
                      contract_type_id: 100
                      reference_id: SD-1234
                      created_by_user_name: Elena Kagan
                      created_by_user_email: elena@acme.com
                      created_by_workspace: 1
                    - id: H-2342
                      created: '2021-05-10T04:42:00Z'
                      created_by: Apple
                      contract_link: https://app.spotdraft.com/contracts/v2/4322
                      contract_status: EXECUTED
                      contract_name: Standard NDA - With Apple
                      counter_party_name: Apple Inc.
                      contract_type_name: Standard NDA
                      contract_type_id: 100
                      reference_id: SD-4322
                      created_by_user_name: Sonia Sotomayor
                      created_by_user_email: sonia@apple.com
                      created_by_workspace: 1
          description: Contract List
      x-tagGroup: Contracts
  /api/v2/public/contracts/embedded/contracts/{contract_id}/counter_party/:
    get:
      operationId: v2_public_contracts_embedded_contracts_counter_party_retrieve
      description: 'Returns a short-lived embedded signing URL for the specified counterparty email on the contract.

        Use this to render the counterparty signing experience inside your own product.'
      summary: Get Counterparty Embedded URL
      parameters:
      - in: path
        name: contract_id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: query
        name: cp_email_id
        schema:
          type: string
        description: Email address of the CP for which the url needs to be returned.
      tags:
      - V2 Contract APIs
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterPartyEmbeddedUrlResponse'
          description: Success
      x-tagGroup: Contracts
  /api/v2/public/contracts/preview/:
    post:
      operationId: v2_public_contracts_preview_create
      description: 'Generates a preview PDF using the supplied contract data without creating or updating a contract.


        Use this to validate how template variables render before you create the actual contract.


        The `contract_data` object must use **template field names as keys**. Each value should match the data type configured for that field in SpotDraft.


        | Field type | Expected value | Example |

        | ---------- | -------------- | ------- |

        | String / text | String | `"Acme Inc."` |

        | Multi-line text | String with line breaks if needed | `"Not applicable\nCustomer redlines pending"` |

        | Number | Integer or decimal | `15` or `3.14` |

        | Boolean / checkbox | Boolean | `true` |

        | Date | `YYYY-MM-DD` | `"2026-03-28"` |

        | Datetime | ISO 8601 timestamp | `"2026-09-15T10:30:00Z"` |

        | Dropdown | Selected option value | `"annual_invoice"` |

        | Multi-select | Array of selected option values | `["US", "IN"]` |

        | Currency | `{ "type": "", "value": number }` | `{ "type": "USD", "value": 12000 }` |

        | Duration | `{ "days": int, "type": "DAYS\|MONTHS\|YEARS", "value": int }` | `{ "days": 180, "type": "MONTHS", "value": 6 }` |

        | Address | Object with address fields | `{ "line_one": "350 Fifth Avenue", "city": "New York", "country": "United States" }` |

        | Repeating group | Array of row objects | `[{"milestone": "Implementation", "amount": {"type": "USD", "value": 5000}}]` |

        | File / attachment | File object or uploaded file reference supported by the workflow | `{ "file_name": "security-schedule.pdf", "content_type": "application/pdf" }` |


        Sample contract data:


        ```json

        {

        "agreement_date": "2026-03-28",

        "renewal_review_at": "2026-09-15T10:30:00Z",

        "customer_name": "Acme Inc.",

        "billing_currency": {"type": "USD", "value": 12000},

        "subscription_term": {"type": "MONTHS", "value": 12, "days": 365},

        "auto_renewal": true,

        "notice_period_days": 30,

        "service_countries": ["US", "IN"],

        "billing_address": {

        "line_one": "350 Fifth Avenue",

        "city": "New York",

        "state": "NY",

        "country": "United States",

        "zipcode": "10118"

        },

        "pricing_schedule": [

        {"milestone": "Implementation", "amount": {"type": "USD", "value": 5000}},

        {"milestone": "Annual subscription", "amount": {"type": "USD", "value": 7000}}

        ],

        "msa_attachment": {"file_name": "security-schedule.pdf", "content_type": "application/pdf"}

        }

        ```'
      summary: Generate Contract Preview
      tags:
      - V2 Contract APIs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateContractPreviewRequest'
            examples:
              PreviewRequest:
                value:
                  contract_template_id: 1204
                  contract_data:
                    agreement_date: '2026-03-28'
                    customer_name: Acme Inc.
                    subscription_term:
                      type: MONTHS
                      value: 12
                      days: 365
                    billing_currency:
                      type: USD
                      value: 12000
                  counter_party_details:
                  - name: Acme Inc.
                    email: legal@acme.example
                summary: Preview request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GenerateContractPreviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GenerateContractPreviewRequest'
        required: true
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: Preview PDF File
      x-tagGroup: Contracts
  /api/v2/public/contracts/upload_review_contracts/:
    post:
      operationId: v2_public_contracts_upload_review_contracts_create
      description: 'This API endpoint supports uploading Third-Party Paper (TPP) contracts and optionally allows for a review request.


        `contract_type_id` must be linked to a published Third-Party Paper upload workflow.

        If this linkage is missing, the API can fail with `SD_CONTRACTS_00289`.


        It accepts intake form data.


        The Intake Form Data should have the following data types with the following output:


        Type

        Data Format

        Sample


        Duration


        {"days": int, "type": DurationKind, "value": int}


        `DurationKind`: `DAYS` or `MONTHS` or `YEARS`


        {"days": 180, "type": "MONTHS", "value": 6}


        Date


        String formatted date in form YYYY-MM-dd


        "2019-11-29"


        Dropdown


        Value as returned in options. Can be string or number.


        "1"


        String


        A string value.


        "Something"


        Currency


        {"type": CurrencyCode, "value": float}


        Where currencyCode: "INR", "USD", "SGD", "EUR"


        {"type": "INR", "value": 15000.00}


        Check-box


        A boolean value


        true


        text-box


        A string value. Can be multi-line


        "Not Applicable\nBecause..."


        number


        A numeric value. Can be int or float


        4 or 3.14


        ### Sample Intake Form Data:

        ```

        {

        "term": {"days": 180, "type": "MONTHS", "value": 6},

        "notes": "Not Applicable",

        "capacity": 15,

        "setup_fee": {"type": "INR", "value": 30000.00},

        "start_date": "2019-11-29",

        "yes_discounts": false,

        "payment_method": "1",

        "suggestions": "No suggestions"

        }

        ```'
      summary: Upload Contract for Review
      tags:
      - V2 Contract APIs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractUploadForReviewRequest'
            examples:
              UploadForReviewRequest:
                value:
                  contract_name: Acme Vendor Paper
                  contract_type_id: 1
                  file_name: vendor-paper.pdf
                  file_base64: base64 encoded string of the PDF file
                  creator_organization_entity_id: 1
                  counterparty_organization_name: Acme Corporation
                  counterparty_is_individual: false
                  counterparty_poc_details:
                    first_name: Avery
                    last_name: Stone
                    email: legal@acme.example
                  reviewer:
                    org_user_email: reviewer@spotdraft.example
                    description: Please review the indemnity clause and payment terms.
                  intake_form_data:
                    term:
                      days: 180
                      type: MONTHS
                      value: 6
                    notes: Customer requested revised indemnity clause.
                    capacity: 15
                    setup_fee:
                      type: USD
                      value: 30000.0
                    start_date: '2026-04-01'
                    payment_method: annual_invoice
                summary: Upload for review request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContractUploadForReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContractUploadForReviewRequest'
        required: true
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponseV2'
              examples:
                Example1:
                  value:
                    id: T-1234
                    created: '2021-05-20T04:52:04Z'
                    contract_name: Acme Corporation NDA
                    contract_link: https://app.spotdraft.com/contracts/v2/4322
                    contract_status: EXECUTED
                    created_by: Morgan Freeman
                    counter_party_name: Mike Reed
                    contract_type_name: Historic
                    contract_type_id: 103
                    external_metadata: {}
                    created_by_user_name: Elena Kagan
                    created_by_user_email: elena@acme.com
                    created_by_workspace: 1
                  summary: Example 1
          description: Success
      x-tagGroup: Contracts
  /api/v2/public/contracts/upload_sign_contracts/:
    post:
      operationId: v2_public_contracts_upload_sign_contracts_create
      description: 'This API can be used to create a new Third-Party Paper (TPP) contract for signing.

        Use this API when you want to upload a new contract and send it for signing.


        `contract_type_id` must be linked to a published Third-Party Paper upload workflow.

        If this linkage is missing, the API can fail with `SD_CONTRACTS_00289`.


        It accepts intake form data.


        The Intake Form Data should have the following data types with the following output:


        Type

        Data Format

        Sample


        Duration


        {"days": int, "type": DurationKind, "value": int}


        `DurationKind`: `DAYS` or `MONTHS` or `YEARS`


        {"days": 180, "type": "MONTHS", "value": 6}


        Date


        String formatted date in form YYYY-MM-dd


        "2019-11-29"


        Dropdown


        Value as returned in options. Can be string or number.


        "1"


        String


        A string value.


        "Something"


        Currency


        {"type": CurrencyCode, "value": float}


        Where currencyCode: "INR", "USD", "SGD", "EUR"


        {"type": "INR", "value": 15000.00}


        Check-box


        A boolean value


        true


        text-box


        A string value. Can be multi-line


        "Not Applicable\nBecause..."


        number


        A numeric value. Can be int or float


        4 or 3.14


        ### Sample Intake Form Data:

        ```

        {

        "term": {"days": 180, "type": "MONTHS", "value": 6},

        "notes": "Not Applicable",

        "capacity": 15,

        "setup_fee": {"type": "INR", "value": 30000.00},

        "start_date": "2019-11-29",

        "yes_discounts": false,

        "payment_method": "1",

        "suggestions": "No suggestions"

        }

        ```'
      summary: Upload Contract for Signature
      tags:
      - V2 Contract APIs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractUploadForSignatureRequest'
            examples:
              UploadForSignatureRequest:
                value:
                  contract_name: Acme Corporation NDA
                  contract_type_id: 1
                  file_name: Acme_nda.pdf
                  file_base64: base64 encoded string of the PDF file
                  creator_organization_entity_id: 1
                  counterparty_organization_name: Acme Corporation
                  external_metadata:
                    id: hubspot-deal-10024
                    integration_name: HubSpot
                    record_type: Deal
                    record_data:
                      deal_stage: contractsent
                      owner_email: owner@acme.example
                  counterparty_is_individual: false
                  counterparty_poc_details:
                    first_name: Avery
                    last_name: Stone
                    email: legal@acme.example
                  intake_form_data:
                    term:
                      days: 180
                      type: MONTHS
                      value: 6
                    notes: Customer requested revised indemnity clause.
                    capacity: 15
                    setup_fee:
                      type: USD
                      value: 30000.0
                    start_date: '2026-04-01'
                    payment_method: annual_invoice
                  business_user_email: owner@spotdraft.example
                summary: Upload for signature request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContractUploadForSignatureRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContractUploadForSignatureRequest'
        required: true
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponseV2'
              examples:
                Example1:
                  value:
                    id: T-1234
                    created: '2021-05-20T04:52:04Z'
                    contract_name: Acme Corporation NDA
                    contract_link: https://app.spotdraft.com/contracts/v2/4322
                    contract_status: EXECUTED
                    created_by: Morgan Freeman
                    counter_party_name: Mike Reed
                    contract_type_name: Historic
                    contract_type_id: 103
                    external_metadata: {}
                    created_by_user_name: Elena Kagan
                    created_by_user_email: elena@acme.com
                    created_by_workspace: 1
                  summary: Example 1
          description: Success
      x-tagGroup: Contracts
  /api/v2/public/contracts/webhooks/re_trigger_latest/:
    post:
      operationId: v2_public_contracts_webhooks_re_trigger_latest_create
      description: Re-trigger the last webhook call made for all given contracts.
      summary: Re-trigger Contract Webhooks
      tags:
      - V2 Contract APIs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetriggerLatestWebhooksRequest'
            examples:
              Example1:
                value:
                  contract_ids:
                  - 1
                  - 2
                  - 3
                summary: Example 1
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RetriggerLatestWebhooksRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RetriggerLatestWebhooksRequest'
        required: true
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    default: Success
          description: Success
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    default: Not Found
          description: Not Found
      x-tagGroup: Contracts
  /api/v2/public/contracts/{composite_id}/download:
    post:
      operationId: v2_public_contracts_download_create
      description: 'Generates and returns the latest downloadable copy of the contract.


        Use this when you need the contract file itself rather than a temporary download URL.'
      summary: Download Contract File
      parameters:
      - in: path
        name: composite_id
        schema:
          type: string
