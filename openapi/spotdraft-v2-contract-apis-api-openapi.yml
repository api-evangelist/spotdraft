components:
  schemas:
    PatchedIntakeFormData:
      title: IntakeFormData
      description: A key-value object keyed by intake-form question field name. Values must match the question type configured on the contract type questionnaire.
      type: object
      additionalProperties: false
      examples:
      - term:
          days: 180
          type: MONTHS
          value: 6
        notes: Customer requested revised indemnity clause.
        capacity: 15
        setup_fee:
          type: USD
          value: 30000.0
        start_date: '2026-04-01'
        payment_method: annual_invoice
    PublicSupportedDocumentCreateAPIRequest:
      title: PublicSupportedDocumentCreateAPIRequest
      type: object
      properties:
        name:
          title: Name
          description: Name of the document
          type: string
        file_name:
          title: File Name
          description: Name of the file, including its extension.
          type: string
        file_base64:
          title: File Base64
          description: The contents of the file as a base64 encoded string.
          type: string
      required:
      - name
      - file_name
      - file_base64
      examples:
      - name: Acme Corporation Related Document
        file_name: Acme Related Document.pdf
        file_base64: base64 encoded string of the file content
    WorkflowConfig:
      type: object
      properties:
        auto_send_to_counterparty:
          type: boolean
          default: false
        api_only_contract_edits:
          type: boolean
          default: false
        skip_cp_info_collection:
          type: boolean
          default: false
        skip_creator_info_collection:
          type: boolean
          default: false
    ExternalContractStatus:
      type: object
      description: Defines the data that is required to show the status of a contract
      properties:
        contract_status:
          allOf:
          - $ref: '#/components/schemas/ContractDisplayStatusEnum'
          description: 'The status of this contract.


            * `DRAFT` - DRAFT

            * `REDLINING` - REDLINING

            * `SIGN` - SIGN

            * `EXECUTED` - EXECUTED

            * `ON_HOLD` - ON_HOLD

            * `VOIDED` - VOIDED'
        contract_name:
          type: string
          description: The name of the contract that is visible to users.
      required:
      - contract_name
      - contract_status
    ContractResponseV2:
      title: ContractResponseV2
      description: Must be kept in sync with ExternalContractV3Serializer
      type: object
      properties:
        id:
          title: Id
          description: The Id of the contract on SpotDraft's Platform.
          type: string
        created:
          title: Created
          description: The date and time at which the contract was created or uploaded on SpotDraft's platform.
          type: string
          format: date-time
        contract_name:
          title: Contract Name
          description: The name of the contract that is visible to users.
          type: string
        contract_link:
          title: Contract Link
          description: The Url to view the contract.
          type: string
        contract_status:
          title: Contract Status
          description: The status of the contract.
          type: string
        created_by:
          title: Created By
          description: The full name of user who created or uploaded the executed contract on to SpotDraft's platform.
          type: string
        counter_party_name:
          title: Counter Party Name
          description: The full name of the counter party involved in the contract.
          type: string
        contract_type_name:
          title: Contract Type Name
          description: The type of the contract.
          type: string
        contract_type_id:
          title: Contract Type Id
          description: The ID of the contract type.
          type: integer
        external_metadata:
          title: External Metadata
          type: object
        reference_id:
          title: Reference Id
          type: string
        created_by_user_name:
          title: Created By User Name
          description: The full name of user who created or uploaded the executed contract on to SpotDraft's platform.
          type: string
        created_by_user_email:
          title: Created By User Email
          description: The email of user who created or uploaded the executed contract on to SpotDraft's platform.
          type: string
        created_by_workspace:
          title: Created By Workspace
          description: The workspace ID of the user who created or uploaded the executed contract on to SpotDraft's platform.
          type: integer
      required:
      - id
      - created
      - contract_name
      - contract_link
      - contract_status
      - created_by
      - counter_party_name
      - contract_type_name
      - contract_type_id
      - created_by_workspace
      examples:
      - id: T-1234
        created: '2021-05-20T04:52:04Z'
        contract_name: Acme Corporation NDA
        contract_link: https://app.spotdraft.com/contracts/v2/4322
        contract_status: EXECUTED
        created_by: Morgan Freeman
        counter_party_name: Mike Reed
        contract_type_name: Historic
        contract_type_id: 103
        external_metadata: {}
        created_by_user_name: Elena Kagan
        created_by_user_email: elena@acme.com
        created_by_workspace: 1
    EmailBase64Attachment:
      type: object
      properties:
        file_name:
          type: string
        mime_type:
          type: string
        content_base64:
          type: string
      required:
      - content_base64
      - file_name
      - mime_type
    SendToCounterparty:
      type: object
      properties:
        to_emails:
          type: array
          items:
            type: string
          description: Optional list of primary recipient email addresses. If omitted, SpotDraft uses the configured counterparty recipients for the contract.
        cc_emails:
          type: array
          items:
            type: string
          description: Optional list of email addresses to copy on the outbound contract email.
        bcc_emails:
          type: array
          items:
            type: string
          description: Optional list of blind-copy email addresses for the outbound contract email.
        attachment_formats:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentFormatsEnum'
          description: At least one attachment format is required. Allowed values come from the ContractEmailFormat enum.
        extra_attachments:
          type: array
          items:
            $ref: '#/components/schemas/EmailBase64Attachment'
          description: Optional additional attachments to send with the contract email.
        custom_message:
          type: string
          description: Optional custom message to include in the contract email body.
        subject:
          type: string
          description: Optional custom email subject line.
      required:
      - attachment_formats
    AttachmentFormatsEnum:
      enum:
      - DOCX
      - PDF
      - TEMPLATE
      type: string
      description: '* `DOCX` - DOCX

        * `PDF` - PDF

        * `TEMPLATE` - TEMPLATE'
    ContractUploadForReviewRequest:
      title: ContractUploadForReviewRequest
      type: object
      properties:
        contract_name:
          title: Contract Name
          description: The name of the uploaded contract that is visible to users.
          type: string
        contract_type_id:
          title: Contract Type Id
          description: The ID of the contract type for this uploaded contract. Use the [Get Contract Types](#tag/V2.1-Contract-Type-APIs/operation/v2.1_public_contract_types_list) API to get this ID.
          type: integer
        file_name:
          title: File Name
          description: The name of the file being uploaded. This is used when the file is downloaded. Expected to be a fully qualified file name with an extension.
          type: string
        file_base64:
          title: File Base64
          description: The contents of the file as a base64 encoded string.
          type: string
        creator_organization_entity_id:
