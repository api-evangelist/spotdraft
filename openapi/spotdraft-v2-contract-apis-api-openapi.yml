    ContractUploadForSignatureRequest:
      title: ContractUploadForSignatureRequest
      type: object
      properties:
        contract_name:
          title: Contract Name
          description: The name of the uploaded contract that is visible to users.
          type: string
        contract_type_id:
          title: Contract Type Id
          description: The ID of the contract type for this uploaded contract. Use the [Get Contract Types](#tag/V2-Contract-Type-APIs/operation/v2_public_contract_types_list) API to get this ID.
          type: integer
        file_name:
          title: File Name
          description: The name of the file being uploaded. This is used when the file is downloaded. Expected to be a fully qualified file name with an extension.
          minLength: 1
          type: string
        file_base64:
          title: File Base64
          description: The contents of the file as a base64 encoded string.
          minLength: 1
          type: string
        creator_organization_entity_id:
          title: Creator Organization Entity Id
          description: The ID of the organization entity for the creator party of the uploaded contract. Use the [Get Organization Entities](#tag/V2-Organization-APIs/operation/v2_public_organizations_entities_list) API to get this ID.
          type: integer
        counterparty_organization_name:
          title: Counterparty Organization Name
          description: The name of the counter party's organization.
          type: string
        external_metadata:
          title: External Metadata
          type: object
          properties:
            id:
              title: Id
              description: Identifier of the record in the external system.
            integration_name:
              title: Integration Name
              description: Name of the external integration, for example Salesforce.
              type: string
            record_type:
              title: Record Type
              description: External record type, for example Opportunity or Account.
              type: string
            record_data:
              title: Record Data
              description: Arbitrary metadata payload from the external system.
              type: object
            object_configuration_id:
              title: Object Configuration Id
              description: Optional public identifier for a native integration object configuration. When provided, also send `record_type`. The API resolves and stores the corresponding internal entity reference.
              type: string
              format: uuid
          description: Optional external system metadata to associate with the uploaded contract.
        counterparty_is_individual:
          title: Counterparty Is Individual
          description: Defines if this Counterparty is an individual or an organization like a company. When not provided, the counterparty is treated as an organization.
          type: boolean
        counterparty_poc_details:
          title: Counterparty Poc Details
          type: object
          properties:
            first_name:
              title: First Name
              description: The first name of the Point of Contact
              type: string
            last_name:
              title: Last Name
              description: The last name of the Point of Contact
              type: string
            email:
              title: Email
              description: The email address of the Point of Contact
              type: string
          required:
          - first_name
          - last_name
          - email
          description: Point of Contact details for this counterparty. Should be the details of the individual for `counterparty_is_individual=True` and the details of the contact at the counterparty organization in case of `counterparty_is_individual=False`.
        intake_form_data:
          title: Intake Form Data
          description: A key-value object keyed by intake-form questionnaire field name. Values must match the question type configured on the upload workflow. Use the Intake Form Questionnaire API to discover the allowed field names and expected value shapes.
          type: object
        business_user_email:
          title: Business User Email
          description: The email address of the business user for the Upload for Sign contract.
          type: string
          format: email
        creator_signatories:
          title: Creator Signatories
          description: Details of the signatories on the creator party side.
          type: array
          items:
            title: CreatorPartySignatoryRequest
            type: object
            properties:
              email:
                title: Email
                description: Email of the signatory on the creator party side.
                type: string
                format: email
              title:
                title: Title
                description: Title of the signatory.
                default: ''
                type: string
              note:
                title: Note
                description: Note for the signatory
                type: string
            required:
            - email
      required:
      - contract_name
      - contract_type_id
      - file_name
      - file_base64
      - counterparty_organization_name
      examples:
      - contract_name: Acme Corporation NDA
        contract_type_id: 1
        file_name: Acme_nda.pdf
        file_base64: base64 encoded string of the PDF file
        creator_organization_entity_id: 1
        counterparty_organization_name: Acme Corporation
        external_metadata:
          id: hubspot-deal-10024
          integration_name: HubSpot
          record_type: Deal
          record_data:
            deal_stage: contractsent
            owner_email: owner@acme.example
        counterparty_is_individual: false
        counterparty_poc_details:
          first_name: Avery
          last_name: Stone
          email: legal@acme.example
        intake_form_data:
          term:
            days: 180
            type: MONTHS
            value: 6
          notes: Customer requested revised indemnity clause.
          capacity: 15
          setup_fee:
            type: USD
            value: 30000.0
          start_date: '2026-04-01'
          payment_method: annual_invoice
        business_user_email: owner@spotdraft.example
