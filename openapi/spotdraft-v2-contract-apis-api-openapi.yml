          description: Defines if this Counterparty is an individual or an organization like a company.When not provided organization like company is created.
          type: boolean
        counterparty_poc_details:
          title: Counterparty Poc Details
          type: object
          properties:
            first_name:
              title: First Name
              description: The first name of the Point of Contact
              type: string
            last_name:
              title: Last Name
              description: The last name of the Point of Contact
              type: string
            email:
              title: Email
              description: The email address of the Point of Contact
              type: string
          required:
          - first_name
