          title: Counterparty Workspace Id
          description: workspace_id of counterparty organization. Either this field or `counterparty_organization_name` is required.
          type: integer
        counterparty_organization_name:
          title: Counterparty Organization Name
          description: The name of the counter party's organization. Either this field or `counterparty_workspace_id` is required.
          type: string
        counterparty_is_individual:
