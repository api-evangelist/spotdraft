s | Workflow used at contract creation |\n| `current_workflow_title` | `STRING` | Yes | Current workflow name |\n| `workflow_id` | `INT64` | Yes | FK to workflow |\n\n### Enum values\n\n#### `review_status`\n\n- `Review Completed`\n- `Review not yet assigned`\n- `Review in Progress`\n- `Pending`\n\n#### `review_assignment_type`\n\n- `Role`\n- `User`\n\n---\n\n## `signatories`\n\n<a id=\"table-signatories\"></a>\n\nIndividual signatory records — one row per signatory per contract. Per-signatory analytics. time_to_sign_hours is in hours (FLOAT64).\n\n### Schema\n\n| Column | Type | Nullable | Description |\n| --- | --- | --- | --- |\n| `signatory_id` | `INT64` | Yes | Unique signatory record |\n| `contract_id` | `INT64` | Yes | FK to lifecycle table |\n| `workspace_id` | `INT64` | Yes | Workspace filter key |\n| `user_id` | `INT64` | Yes | FK to internal user (NULL for external signatories) |\n| `signatory_name` | `STRING` | Yes | Name of the signatory |\n| `signatory_party` | `STRING` | Yes | COUNTER_PARTY or CREATOR_PARTY |\n| `signing_order` | `INT64` | Yes | Position in signing sequence |\n| `sign_status` | `STRING` | Yes | Current signing status |\n| `created_at` | `TIMESTAMP` | Yes | When signatory was added |\n| `signing_started_at` | `TIMESTAMP` | Yes | When this signatory's turn began |\n| `sign_request_sent_at` | `TIMESTAMP` | Yes | When sign request was sent |\n| `signed_at` | `TIMESTAMP` | Yes | When they signed |\n| `time_to_sign_hours` | `FLOAT64` | Yes | Hours from request sent to signature |\n| `contract_kind` | `STRING` | Yes | How contract entered the system |\n| `contract_type` | `STRING` | Yes | Contract category |\n| `template_name` | `STRING` | Yes | Template used |\n| `contract_name` | `STRING` | Yes | Contract name |\n| `contract_created_date` | `DATE` | Yes | Contract creation date |\n| `execution_date` | `DATE` | Yes | Contract execution date |\n| `counterparty_name` | `STRING` | Yes | Counterparty name |\n| `legal_owner` | `STRING` | Yes | Legal team owner |\n| `business_owner` | `STRING` | Yes | Business-side owner |\n| `workflow_status` | `STRING` | Yes | Workflow state |\n| `signature_service` | `STRING` | Yes | Connected integration name |\n| `workflow_title_at_creation` | `STRING` | Yes | Workflow used at contract creation |\n| `current_workflow_title` | `STRING` | Yes | Current workflow name |\n| `workflow_id` | `INT64` | Yes | FK to workflow |\n\n### Enum values\n\n#### `signatory_party`\n\n- `COUNTER_PARTY`\n- `CREATOR_PARTY`\n\n#### `sign_status`\n\n- `Signed`\n- `Pending`\n- `Declined`\n- `Bounced`\n\n#### `signature_service`\n\n- `SpotSign`\n- `DocuSign`\n- `AdobeSign`\n- `ZohoSign`\n\n---\n\n## `contract_level_metrics`\n\n<a id=\"table-contract_level_metrics\"></a>\n\nEvent-level lifecycle tracking — multiple rows per contract. time_spent_seconds is in seconds (INT64); divide by 3600 for hours. \n\n### Schema\n\n| Column | Type | Nullable | Description |\n| --- | --- | --- | --- |\n| `contract_id` | `INT64` | Yes | FK to lifecycle table |\n| `workspace_id` | `INT64` | Yes | Workspace filter (maps from created_by_workspace_id) |\n| `event_id` | `STRING` | Yes | Unique event instance ID |\n| `event_sequence` | `STRING` | Yes | Sequence ordering of events |\n| `event_category` | `STRING` | Yes | High-level event type |\n| `event_subcategory_1` | `STRING` | Yes | Event sub-category level 1 |\n| `event_subcategory_2` | `STRING` | Yes | Event sub-category level 2 |\n| `status` | `STRING` | Yes | Status during this interval |\n| `started_at` | `TIMESTAMP` | Yes | Start of this time interval |\n| `ended_at` | `TIMESTAMP` | Yes | End of this interval (historical) |\n| `ended_at_current` | `TIMESTAMP` | Yes | End of interval (current; may be ongoing) |\n| `time_spent_seconds` | `INT64` | Yes | Time spent in this state, in seconds |\n| `party_type` | `STRING` | Yes | Internal or External party |\n| `review_filter` | `STRING` | Yes | Review stage filter flag |\n| `approval_filter` | `STRING` | Yes | Approval stage filter flag |\n| `sign_filter` | `STRING` | Yes | Sign stage filter flag |\n\n---\n\n## `contract_level_metrics_lc`\n\n<a id=\"table-contract_level_metrics_lc\"></a>\n\nLifecycle-focused variant of contract_level_metrics — same structure without review_filter, approval_filter, sign_filter. time_spent_seconds in seconds.\n\n### Schema\n\n| Column | Type | Nullable | Description |\n| --- | --- | --- | --- |\n| `contract_id` | `INT64` | Yes | FK to lifecycle table |\n| `workspace_id` | `INT64` | Yes | Workspace filter (maps from created_by_workspace_id) |\n| `event_id` | `STRING` | Yes | Unique event instance ID |\n| `event_sequence` | `STRING` | Yes | Sequence ordering of events |\n| `event_category` | `STRING` | Yes | High-level event type |\n| `event_subcategory_1` | `STRING` | Yes | Event sub-category level 1 |\n| `event_subcategory_2` | `STRING` | Yes | Event sub-category level 2 |\n| `status` | `STRING` | Yes | Status during this interval |\n| `started_at` | `TIMESTAMP` | Yes | Start of interval |\n| `ended_at` | `TIMESTAMP` | Yes | End of interval (historical) |\n| `ended_at_current` | `TIMESTAMP` | Yes | End of interval (current) |\n| `time_spent_seconds` | `INT64` | Yes | Time in state, in seconds |\n| `party_type` | `STRING` | Yes | Internal or External |\n\n---\n\n## `legal_intake`\n\n<a id=\"table-legal_intake\"></a>\n\nLegal intake requests — one row per intake item. Legal ops workload and intake SLA.\n\n### Schema\n\n| Column | Type | Nullable | Description |\n| --- | --- | --- | --- |\n| `intake_id` | `INT64` | Yes | Unique intake item ID |\n| `workspace_id` | `INT64` | Yes | Workspace filter key |\n| `title` | `STRING` | Yes | Intake request title |\n| `created_at` | `TIMESTAMP` | Yes | When intake was created |\n| `status` | `STRING` | Yes | Current status |\n| `priority` | `STRING` | Yes | Priority level |\n| `due_date` | `DATE` | Yes | Target completion date |\n| `completed_at` | `TIMESTAMP` | Yes | When marked complete |\n| `requested_by` | `STRING` | Yes | Who submitted the intake |\n| `assignee` | `STRING` | Yes | Who is responsible |\n| `workflow_name` | `STRING` | Yes | Associated workflow, if any |\n| `linked_entity_type` | `STRING` | Yes | Type of linked entity (e.g. contract) |\n| `linked_entity_id` | `STRING` | Yes | ID of the linked entity |\n| `pending_with` | `STRING` | Yes | Who the intake is pending with |\n| `completion_time_days` | `FLOAT64` | Yes | Days taken to complete |\n| `completion_time_hours` | `FLOAT64` | Yes | Hours taken to complete |\n| `pending_since_hours` | `FLOAT64` | Yes | Hours since intake was last actioned |\n| `pending_since_days` | `FLOAT64` | Yes | Days since intake was last actioned |\n\n### Enum values\n\n#### `status`\n\n- `Completed`\n- `Pending`\n- `In Progress`\n- `Cancelled`\n\n#### `priority`\n\n- `High`\n- `Medium`\n- `Low`\n\n---\n\n## Join map\n\n```\ncontracts.workflow_id ─────────────► workflows_setup.workflow_id\ncontracts.frozen_workflow_id ───────► workflows_setup.frozen_workflow_id\ncontracts.contract_type_id ─────────► contract_types_setup.contract_type_id\ncontracts.counterparty_name ────────► counterparties_setup.counterparty_name (join on public name)\nworkflows_setup.frozen_workflow_id ─► approvals_setup.frozen_workflow_id\nworkflows_setup.workflow_id ────────► signatures_setups.workflow_id\n\ncontract_lifecycle.contract_id ─────► contract_tat_details.contract_id\ncontract_lifecycle.contract_id ─────► contract_sign.contract_id\ncontract_lifecycle.contract_id ─────► contract_approvals.contract_id\ncontract_lifecycle.contract_id ─────► contracts_review.contract_id\ncontract_lifecycle.contract_id ─────► signatories.contract_id\ncontract_lifecycle.contract_id ─────► contract_level_metrics.contract_id\ncontract_lifecycle.contract_id ─────► contract_level_metrics_lc.contract_id\n```\n\nUse **public** column names in SQL. Table references may use bare catalog names (e.g. `contracts`); matching is case-insensitive."
servers:
- url: https://api.eu.spotdraft.com
  description: Europe
- url: https://api.in.spotdraft.com
  description: India
- url: https://api.us.spotdraft.com
  description: United States
- url: https://api.me.spotdraft.com
  description: Middle East
tags:
- name: V2 Contract APIs
  description: Contract creation, retrieval, updates, previews, downloads, uploads, and lifecycle actions across public API versions.
paths:
  /api/v2/public/contracts/:
    get:
      operationId: v2_public_contracts_retrieve
      description: 'Returns contracts visible to the current workspace.


        Use pagination, filter, and sort parameters to narrow the result set. Where supported by the version, contract metadata filters are also available.'
      summary: List Contracts
      parameters:
      - in: query
        name: filter__client_email_address
        schema:
          type: string
        description: Filters on the counter party email. Does an exact match.
      - in: query
        name: filter__client_name
        schema:
          type: string
        description: Filters on the counter party name. Does an exact match.
      - in: query
        name: limit
        schema:
          type: integer
          default: 10
        description: The number of items to return per page.
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: The page to return. Page numbers start at 1.
      tags:
      - V2 Contract APIs
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractListResponseV2'
              examples:
                Example:
                  value:
                    total_results: 2
                    page: 1
                    limit: 10
                    results:
                    - id: T-34211
                      created: '2021-05-20T04:52:04Z'
                      created_by: Acme
                      contract_link: https://app.spotdraft.com/contracts/v2/1234
                      contract_status: REDLINING
                      contract_name: Standard NDA
                      counter_party_name: Microsoft
                      contract_type_name: Standard NDA
                      contract_type_id: 100
                      reference_id: SD-1234
                      created_by_user_name: Elena Kagan
                      created_by_user_email: elena@acme.com
                      created_by_workspace: 1
                    - id: H-2342
                      created: '2021-05-10T04:42:00Z'
                      created_by: Apple
                      contract_link: https://app.spotdraft.com/contracts/v2/4322
                      contract_status: EXECUTED
                      contract_name: Standard NDA - With Apple
                      counter_party_name: Apple Inc.
                      contract_type_name: Standard NDA
                      contract_type_id: 100
                      reference_id: SD-4322
                      created_by_user_name: Sonia Sotomayor
                      created_by_user_email: sonia@apple.com
                      created_by_workspace: 1
          description: Contract List
      x-tagGroup: Contracts
    post:
      operationId: v2_public_contracts_create
      description: "Creates a new contract from a SpotDraft template and returns the created contract.\n\nProvide the template id, contract data, and counterparty details needed to render the agreement. Use this endpoint when you want SpotDraft to generate the contract from structured data.\n\nCreates a new contract from a SpotDraft template and returns the created contract.\n\nProvide contract data, counterparty details, and any required signatories for the workflow.\n\n\nIn signatories list, sign_order should be set for either all items or no items of the list. Additionally when\nsign_order is set for all items of signatories list then at-least one counter party signatory user should also be part\nof the list.\n\nThe `contract_data` object must use **template field names as keys**. Each value should match the data type configured for that field in SpotDraft.\n\n| Field type | Expected value | Example |\n| ---------- | -------------- | ------- |\n| String / text | String | `\"Acme Inc.\"` |\n| Multi-line text | String with line breaks if needed | `\"Not applicable\\nCustomer redlines pending\"` |\n| Number | Integer or decimal | `15` or `3.14` |\n| Boolean / checkbox | Boolean | `true` |\n| Date | `YYYY-MM-DD` | `\"2026-03-28\"` |\n| Datetime | ISO 8601 timestamp | `\"2026-09-15T10:30:00Z\"` |\n| Dropdown | Selected option value | `\"annual_invoice\"` |\n| Multi-select | Array of selected option values | `[\"US\", \"IN\"]` |\n| Currency | `{ \"type\": \"<ISO currency>\", \"value\": number }` | `{ \"type\": \"USD\", \"value\": 12000 }` |\n| Duration | `{ \"days\": int, \"type\": \"DAYS\\|MONTHS\\|YEARS\", \"value\": int }` | `{ \"days\": 180, \"type\": \"MONTHS\", \"value\": 6 }` |\n| Address | Object with address fields | `{ \"line_one\": \"350 Fifth Avenue\", \"city\": \"New York\", \"country\": \"United States\" }` |\n| Repeating group | Array of row objects | `[{\"milestone\": \"Implementation\", \"amount\": {\"type\": \"USD\", \"value\": 5000}}]` |\n| File / attachment | File object or uploaded file reference supported by the workflow | `{ \"file_name\": \"security-schedule.pdf\", \"content_type\": \"application/pdf\" }` |\n\nSample contract data:\n\n```json\n{\n  \"agreement_date\": \"2026-03-28\",\n  \"renewal_review_at\": \"2026-09-15T10:30:00Z\",\n  \"customer_name\": \"Acme Inc.\",\n  \"billing_currency\": {\"type\": \"USD\", \"value\": 12000},\n  \"subscription_term\": {\"type\": \"MONTHS\", \"value\": 12, \"days\": 365},\n  \"auto_renewal\": true,\n  \"notice_period_days\": 30,\n  \"service_countries\": [\"US\", \"IN\"],\n  \"billing_address\": {\n    \"line_one\": \"350 Fifth Avenue\",\n    \"city\": \"New York\",\n    \"state\": \"NY\",\n    \"country\": \"United States\",\n    \"zipcode\": \"10118\"\n  },\n  \"pricing_schedule\": [\n    {\"milestone\": \"Implementation\", \"amount\": {\"type\": \"USD\", \"value\": 5000}},\n    {\"milestone\": \"Annual subscription\", \"amount\": {\"type\": \"USD\", \"value\": 7000}}\n  ],\n  \"msa_attachment\": {\"file_name\": \"security-schedule.pdf\", \"content_type\": \"application/pdf\"}\n}\n```\n"
      summary: Create Contract
      parameters:
      - in: header
        name: user-email
        schema:
          type: string
        description: The email address of the user to act as (when using client-secret authentication). This header attributes actions taken using the API to the given user.
      tags:
      - V2 Contract APIs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalCreateContract'
            examples:
              CreateContractRequest:
                value:
                  contract_template_id: 1204
                  contract_data:
                    agreement_date: '2026-03-28'
                    renewal_review_at: '2026-09-15T10:30:00Z'
                    customer_name: Acme Inc.
                    billing_currency:
                      type: USD
                      value: 12000
                    subscription_term:
                      type: MONTHS
                      value: 12
                      days: 365
                    auto_renewal: true
                    notice_period_days: 30
                    service_countries:
                    - US
                    - IN
                    billing_address:
                      line_one: 350 Fifth Avenue
                      city: New York
                      state: NY
                      country: United States
                      zipcode: '10118'
                    pricing_schedule:
                    - milestone: Implementation
                      amount:
                        type: USD
                        value: 5000
                    - milestone: Annual subscription
                      amount:
                        type: USD
                        value: 7000
                    msa_attachment:
                      file_name: security-schedule.pdf
                      content_type: application/pdf
                  counter_party_details:
                  - is_individual: false
                    organization_type: company
                    organization_name: Acme Inc.
                    poc_details:
                      first_name: Avery
                      last_name: Stone
                      email: legal@acme.example
                    organization_details:
                      jurisdiction: Delaware
                      address:
                        line_one: 350 Fifth Avenue
                        city: New York
                        state: NY
                        country: United States
                        zipcode: '10118'
                  external_metadata:
                    id: hubspot-deal-10024
                    integration_name: HubSpot
                    record_type: Deal
                    record_data:
                      deal_stage: contractsent
                      owner_email: owner@acme.example
                  contract_name: Acme Master Services Agreement
                summary: Create contract request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExternalCreateContract'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExternalCreateContract'
        required: true
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalCreateContractResponse'
          description: ''
      x-tagGroup: Contracts
  /api/v2/public/contracts/by_external_metadata/{external_metadata_id}:
    get:
      operationId: v2_public_contracts_by_external_metadata_retrieve
      description: 'Returns up to 50 contracts linked to the supplied external metadata id.


        Use this when you have an external system record id and need to find the related SpotDraft contracts.'
      summary: List Contracts by External Metadata ID
      parameters:
      - in: path
        name: external_metadata_id
        schema:
          type: string
        description: External Metadata ID of the Contract. This can be used to search for contracts based on an ID specified when creating the contract using the external API.
        required: true
      tags:
      - V2 Contract APIs
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExternalContractV3'
              examples:
                Example:
                  value:
                  - - id: T-34211
                      created: '2021-05-20T04:52:04Z'
                      created_by: Acme
                      contract_link: https://app.spotdraft.com/contracts/v2/1234
                      contract_status: REDLINING
                      contract_name: Standard NDA
                      counter_party_name: Microsoft
                      contract_type_name: Standard NDA
                      contract_type_id: 100
                      reference_id: SD-1234
                      created_by_user_name: Elena Kagan
                      created_by_user_email: elena@acme.com
                      created_by_workspace: 1
                    - id: H-2342
                      created: '2021-05-10T04:42:00Z'
                      created_by: Apple
                      contract_link: https://app.spotdraft.com/contracts/v2/4322
                      contract_status: EXECUTED
                      contract_name: Standard NDA - With Apple
                      counter_party_name: Apple Inc.
                      contract_type_name: Standard NDA
                      contract_type_id: 100
                      reference_id: SD-4322
                      created_by_user_name: Sonia Sotomayor
                      created_by_user_email: sonia@apple.com
                      created_by_workspace: 1
          description: Contract List
      x-tagGroup: Contracts
  /api/v2/public/contracts/embedded/contracts/{contract_id}/counter_party/:
    get:
      operationId: v2_public_contracts_embedded_contracts_counter_party_retrieve
      description: '

        Returns a short-lived embedded signing URL for the specified counterparty email on the contract.

        Use this to render the counterparty signing experience inside your own product.

        '
      summary: Get Counterparty Embedded URL
      parameters:
      - in: path
        name: contract_id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: query
        name: cp_email_id
        schema:
          type: string
        description: Email address of the CP for which the url needs to be returned.
      tags:
      - V2 Contract APIs
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterPartyEmbeddedUrlResponse'
          description: Success
      x-tagGroup: Contracts
  /api/v2/public/contracts/preview/:
    post:
      operationId: v2_public_contracts_preview_create
      description: "Generates a preview PDF using the supplied contract data without creating or updating a contract.\n\nUse this to validate how template variables render before you create the actual contract.\n\n\nThe `contract_data` object must use **template field names as keys**. Each value should match the data type configured for that field in SpotDraft.\n\n| Field type | Expected value | Example |\n| ---------- | -------------- | ------- |\n| String / text | String | `\"Acme Inc.\"` |\n| Multi-line text | String with line breaks if needed | `\"Not applicable\\nCustomer redlines pending\"` |\n| Number | Integer or decimal | `15` or `3.14` |\n| Boolean / checkbox | Boolean | `true` |\n| Date | `YYYY-MM-DD` | `\"2026-03-28\"` |\n| Datetime | ISO 8601 timestamp | `\"2026-09-15T10:30:00Z\"` |\n| Dropdown | Selected option value | `\"annual_invoice\"` |\n| Multi-select | Array of selected option values | `[\"US\", \"IN\"]` |\n| Currency | `{ \"type\": \"<ISO currency>\", \"value\": number }` | `{ \"type\": \"USD\", \"value\": 12000 }` |\n| Duration | `{ \"days\": int, \"type\": \"DAYS\\|MONTHS\\|YEARS\", \"value\": int }` | `{ \"days\": 180, \"type\": \"MONTHS\", \"value\": 6 }` |\n| Address | Object with address fields | `{ \"line_one\": \"350 Fifth Avenue\", \"city\": \"New York\", \"country\": \"United States\" }` |\n| Repeating group | Array of row objects | `[{\"milestone\": \"Implementation\", \"amount\": {\"type\": \"USD\", \"value\": 5000}}]` |\n| File / attachment | File object or uploaded file reference supported by the workflow | `{ \"file_name\": \"security-schedule.pdf\", \"content_type\": \"application/pdf\" }` |\n\nSample contract data:\n\n```json\n{\n  \"agreement_date\": \"2026-03-28\",\n  \"renewal_review_at\": \"2026-09-15T10:30:00Z\",\n  \"customer_name\": \"Acme Inc.\",\n  \"billing_currency\": {\"type\": \"USD\", \"value\": 12000},\n  \"subscription_term\": {\"type\": \"MONTHS\", \"value\": 12, \"days\": 365},\n  \"auto_renewal\": true,\n  \"notice_period_days\": 30,\n  \"service_countries\": [\"US\", \"IN\"],\n  \"billing_address\": {\n    \"line_one\": \"350 Fifth Avenue\",\n    \"city\": \"New York\",\n    \"state\": \"NY\",\n    \"country\": \"United States\",\n    \"zipcode\": \"10118\"\n  },\n  \"pricing_schedule\": [\n    {\"milestone\": \"Implementation\", \"amount\": {\"type\": \"USD\", \"value\": 5000}},\n    {\"milestone\": \"Annual subscription\", \"amount\": {\"type\": \"USD\", \"value\": 7000}}\n  ],\n  \"msa_attachment\": {\"file_name\": \"security-schedule.pdf\", \"content_type\": \"application/pdf\"}\n}\n```\n"
      summary: Generate Contract Preview
      tags:
      - V2 Contract APIs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateContractPreviewRequest'
            examples:
              PreviewRequest:
                value:
                  contract_template_id: 1204
                  contract_data:
                    agreement_date: '2026-03-28'
                    customer_name: Acme Inc.
                    subscription_term:
                      type: MONTHS
                      value: 12
                      days: 365
                    billing_currency:
                      type: USD
                      value: 12000
                  counter_party_details:
                  - name: Acme Inc.
                    email: legal@acme.example
                summary: Preview request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GenerateContractPreviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GenerateContractPreviewRequest'
        required: true
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: Preview PDF File
      x-tagGroup: Contracts
  /api/v2/public/contracts/upload_review_contracts/:
    post:
      operationId: v2_public_contracts_upload_review_contracts_create
      description: "\nThis API endpoint supports uploading Third-Party Paper (TPP) contracts and optionally allows for a review request.\n\n`contract_type_id` must be linked to a published Third-Party Paper upload workflow.\nIf this linkage is missing, the API can fail with `SD_CONTRACTS_00289`.\n\nIt accepts intake form data.\n\nThe Intake Form Data should have the following data types with the following output:\n<table>\n    <thead>\n    <tr>\n        <td>Type</td>\n        <td>Data Format</td>\n        <td>Sample</td>\n    </tr>\n    </thead>\n<tbody>\n    <tr>\n    <td>Duration</td>\n    <td>\n        <code>{\"days\": int, \"type\": DurationKind, \"value\": int}</code><br/>\n        `DurationKind`: `DAYS` or `MONTHS` or `YEARS`\n    </td>\n    <td><code>{\"days\": 180, \"type\": \"MONTHS\", \"value\": 6}</code></td>\n    </tr>\n    <tr>\n    <td>Date</td>\n    <td>\n        String formatted date in form <code>YYYY-MM-dd</code>\n    </td>\n    <td><code>\"2019-11-29\"</code></td>\n    </tr>\n    <tr>\n    <td>Dropdown</td>\n    <td>\n        Value as returned in <code>options</code>. Can be string or number.\n    </td>\n    <td><code>\"1\"</code></td>\n    </tr>\n    <tr>\n    <td>String</td>\n    <td>\n        A string value.\n    </td>\n    <td><code>\"Something\"</code></td>\n    </tr>\n    <tr>\n    <td>Currency</td>\n    <td>\n        <code>{\"type\": CurrencyCode, \"value\": float}</code><br/>\n        Where currencyCode: \"INR\", \"USD\", \"SGD\", \"EUR\"\n    </td>\n    <td><code>{\"type\": \"INR\", \"value\": 15000.00}</code></td>\n    </tr>\n    <tr>\n    <td>Check-box</td>\n    <td>\n        A boolean value\n    </td>\n    <td><code>true</code></td>\n    </tr>\n    <tr>\n    <td>text-box</td>\n    <td>\n        A string value. Can be multi-line\n    </td>\n    <td><code>\"Not Applicable\\nBecause...\"</code></td>\n    </tr>\n    <tr>\n    <td>number</td>\n    <td>\n        A numeric value. Can be int or float\n    </td>\n    <td><code>4</code> or <code>3.14</code></td>\n    </tr>\n</tbody>\n</table>\n\n\n### Sample Intake Form Data:\n```\n{\n    \"term\": {\"days\": 180, \"type\": \"MONTHS\", \"value\": 6},\n    \"notes\": \"Not Applicable\",\n    \"capacity\": 15,\n    \"setup_fee\": {\"type\": \"INR\", \"value\": 30000.00},\n    \"start_date\": \"2019-11-29\",\n    \"yes_discounts\": false,\n    \"payment_method\": \"1\",\n    \"suggestions\": \"No suggestions\"\n}\n```\n"
      summary: Upload Contract for Review
      tags:
      - V2 Contract APIs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractUploadForReviewRequest'
            examples:
              UploadForReviewRequest:
                value:
                  contract_name: Acme Vendor Paper
                  contract_type_id: 1
                  file_name: vendor-paper.pdf
                  file_base64: base64 encoded string of the PDF file
                  creator_organization_entity_id: 1
                  counterparty_organization_name: Acme Corporation
                  counterparty_is_individual: false
                  counterparty_poc_details:
                    first_name: Avery
                    last_name: Stone
                    email: legal@acme.example
                  reviewer:
                    org_user_email: reviewer@spotdraft.example
                    description: Please review the indemnity clause and payment terms.
                  intake_form_data:
                    term:
                      days: 180
                      type: MONTHS
                      value: 6
                    notes: Customer requested revised indemnity clause.
                    capacity: 15
                    setup_fee:
                      type: USD
                      value: 30000.0
                    start_date: '2026-04-01'
                    payment_method: annual_invoice
                summary: Upload for review request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ContractUploadForReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContractUploadForReviewRequest'
        required: true
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractResponseV2'
              examples:
                Example1:
                  value:
                    id: T-1234
                    created: '2021-05-20T04:52:04Z'
                    contract_name: Acme Corporation NDA
                    contract_link: https://app.spotdraft.com/contracts/v2/4322
                    contract_status: EXECUTED
                    created_by: Morgan Freeman
                    counter_party_name: Mike Reed
                    contract_type_name: Historic
                    contract_type_id: 103
                    external_metadata: {}
                    created_by_user_name: Elena Kagan
                    created_by_user_email: elena@acme.com
                    created_by_workspace: 1
                  summary: Example 1
          description: Success
      x-tagGroup: Contracts
  /api/v2/public/contracts/upload_sign_contracts/:
    post:
      operationId: v2_public_contracts_upload_sign_contracts_create
      description: "\nThis API can be used to create a new Third-Party Paper (TPP) contract for signing.\nUse this API when you want to upload a new contract and send it for signing.\n\n`contract_type_id` must be linked to a published Third-Party Paper upload workflow.\nIf this linkage is missing, the API can fail with `SD_CONTRACTS_00289`.\n\nIt accepts intake form data.\n\nThe Intake Form Data should have the following data types with the following output:\n<table>\n    <thead>\n    <tr>\n        <td>Type</td>\n        <td>Data Format</td>\n        <td>Sample</td>\n    </tr>\n    </thead>\n<tbody>\n    <tr>\n    <td>Duration</td>\n    <td>\n        <code>{\"days\": int, \"type\": DurationKind, \"value\": int}</code><br/>\n        `DurationKind`: `DAYS` or `MONTHS` or `YEARS`\n    </td>\n    <td><code>{\"days\": 180, \"type\": \"MONTHS\", \"value\": 6}</code></td>\n    </tr>\n    <tr>\n    <td>Date</td>\n    <td>\n        String formatted date in form <code>YYYY-MM-dd</code>\n    </td>\n    <td><code>\"2019-11-29\"</code></td>\n    </tr>\n    <tr>\n    <td>Dropdown</td>\n    <td>\n        Value as returned in <code>options</code>. Can be string or number.\n    </td>\n    <td><code>\"1\"</code></td>\n    </tr>\n    <tr>\n    <td>String</td>\n    <td>\n        A string value.\n    </td>\n    <td><code>\"Something\"</code></td>\n    </tr>\n    <tr>\n    <td>Currency</td>\n    <td>\n        <code>{\"type\": CurrencyCode, \"value\": float}</code><br/>\n        Where currencyCode: \"INR\", \"USD\", \"SGD\", \"EUR\"\n    </td>\n    <td><code>{\"type\": \"INR\", \"value\": 15000.00}</code></td>\n    </tr>\n    <tr>\n    <td>Check-box</td>\n    <td>\n        A boolean value\n    </td>\n    <td><code>true</code></td>\n    </tr>\n    <tr>\n    <td>text-box</td>\n    <td>\n        A string value. Can be multi-line\n    </td>\n    <td><code>\"Not Applicable\\nBecause...\"</code></td>\n    </tr>\n    <tr>\n    <td>number</td>\n    <td>\n        A numeric value. Can be int or float\n    </td>\n    <td><code>4</code> or <code>3.14</code></td>\n    </tr>\n</tbody>\n</table>\n\n\n### Sample Intake Form Data:\n```\n{\n    \"term\": {\"days\": 180, \"type\": \"MONTHS\", \"value\": 6},\n    \"notes\": \"Not Applicable\",\n    \"capacity\": 15,\n    \"setup_fee\": {\"type\": \"INR\", \"value\": 30000.00},\n    \"start_date\": \"2019-11-29\",\n    \"yes_discounts\": false,\n    \"payment_method\": \"1\",\n    \"suggestions\": \"No suggestions\"\n}\n```\n"
      summary: Upload Contract for Signature
      tags:
