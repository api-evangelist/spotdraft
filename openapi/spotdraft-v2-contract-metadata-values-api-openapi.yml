openapi: 3.2.0
info:
  title: SpotDraft V2 Contract Metadata Values API
  version: v1
  x-version: v1
  x-logo:
    url: https://cdn.spotdraft.com/assets/logo-black-new.png
    backgroundColor: transparent
    altText: SpotDraft Logo
    href: https://spotdraft.com
  x-favicon: https://cdn.spotdraft.com/assets/favicon.png
  x-footer: © SpotDraft Inc. All rights reserved.
  description: '# SpotDraft Public API


    Welcome to the **SpotDraft Public API**.'
servers:
- url: https://api.eu.spotdraft.com
  description: Europe
- url: https://api.in.spotdraft.com
  description: India
- url: https://api.us.spotdraft.com
  description: United States
- url: https://api.me.spotdraft.com
  description: Middle East
tags:
- name: V2 Contract Metadata Values
  description: Read and update contract metadata values for a specific contract. Legacy API paths may still use key-pointer naming.
paths:
  /api/v2/public/contracts/{composite_id}/key_pointers:
    get:
      operationId: v2_public_contracts_key_pointers_retrieve
      description: 'Returns **contract metadata values** for the requested contract.


        Use this when you already have a specific contract id and need the metadata captured on that contract. This is different from the metadata-definition APIs, which list field definitions for a workspace or contract type.


        The underlying API paths still use legacy key-pointer naming for backward compatibility. When the `Enforce-User-Scoping` header is `true`, only metadata values for contracts the specified user may access (based on their permissions) are returned.'
      summary: Get Contract Metadata Values
      parameters:
      - in: path
        name: composite_id
        schema:
          type: string
        description: ID of the Contract. Should be of the form T-123 or H-123. T stands for Template contracts and H stands for Historical contracts.
        required: true
      tags:
      - V2 Contract Metadata Values
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractKeyPointerMinimalListResponse'
          description: Success
      x-tagGroup: Contracts
  /api/v2/public/contracts/{contract_id}/key_pointers/{contract_key_pointer_id}:
    patch:
      operationId: v2_public_contracts_key_pointers_partial_update
      description: Updates the specified contract metadata value. The underlying API path still uses legacy key-pointer naming for backward compatibility.
      summary: Update Contract Metadata Value
      parameters:
      - in: path
        name: contract_id
        schema:
          type: string
        description: ID of the Contract. Should be of the form T-123 or H-123. T stands for Template contracts and H stands for Historical contracts.
        required: true
      - in: path
        name: contract_key_pointer_id
        schema:
          type: string
        description: ID of the contract key pointer value.
        required: true
      tags:
      - V2 Contract Metadata Values
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedContractKeyPointerUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedContractKeyPointerUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedContractKeyPointerUpdateRequest'
      security:
      - ClientId: []
        ClientSecret: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractKeyPointerMinimalResponse'
              examples:
                Example1:
                  value:
                    id: 1
                    value: sample
                    label: Sample Label
                    filed_name: sample_field_name
                    data_type: string
                    format_option:
                      data: sample format option
                  summary: Example 1
          description: Success
      x-tagGroup: Contracts
