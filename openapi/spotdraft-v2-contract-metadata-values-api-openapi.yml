                            properties:
                              id:
                                title: Id
                                type: object
                              text:
                                title: Text
                                default: ''
                                type: string
                              value:
                                title: Value
                                type: object
                              bounding_boxes:
                                title: Bounding Boxes
                                type: array
                                items:
                                  title: BoundingBox
                                  description: Defines the bounding box of a element inside the document.
                                  type: object
                                  properties:
                                    top_left:
                                      title: Coordinates
                                      description: Defines horizontal and vertical position of a point on a page.
                                      type: object
                                      properties:
                                        x:
                                          title: X
                                          type: number
                                        y:
                                          title: Y
                                          type: number
                                      required:
                                      - x
                                      - y
                                    bottom_right:
                                      title: Coordinates
                                      description: Defines horizontal and vertical position of a point on a page.
                                      type: object
                                      properties:
                                        x:
                                          title: X
                                          type: number
                                        y:
                                          title: Y
                                          type: number
                                      required:
                                      - x
