                            default: false
                            type: boolean
                          source:
                            title: Source
                            type: object
                          standard_text:
                            title: Standard Text
                            type: string
                        required:
                        - uuid
                        - para_id
                        - span
                        - label
                        - confidence_score
                        - source
                      source:
                        title: Source
                        type: string
                    required:
                    - id
                    - async_task_id
                    - value
                    - deal_point
                    - source
                  rank:
                    title: Rank
                    type: integer
                  score:
                    title: Score
                    type: number
                  source:
                    title: Source
                    type: string
                  parsed_value:
                    title: Parsed Value
